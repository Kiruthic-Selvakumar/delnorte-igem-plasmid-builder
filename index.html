function CodonPanel({ organisms, cdsPool, template, accepted, onAccept, onClear }) {
  const C = window.Codon;
  const orgList = useMemo(() => (organisms ? Object.values(organisms) : []), [organisms]);
  const hostOrg = useMemo(
    () => (C && organisms && template) ? C.organismForHost(organisms, template.host) : null,
    [C, organisms, template]);

  const [orgId, setOrgId] = useState("");
  const [orgTouched, setOrgTouched] = useState(false);
  const [raw, setRaw] = useState("");
  const [srcRec, setSrcRec] = useState(null);
  const [env, setEnv] = useState({temp:37, ph:7, salt:0.5, oxygen:"aerobic"});
  const [envOrg, setEnvOrg] = useState("");
  const [cardinalOv, setCardinalOv] = useState({});
  const [cardNote, setCardNote] = useState("");
  const [cons, setCons] = useState({typeIIS:true, cloning:true, internalSD:true,
    avoidRepeats:true, maxHomopolymer:5, lockN:0, gcMin:30, gcMax:72, custom:""});
  const [autoW, setAutoW] = useState(true);
  const [manualW, setManualW] = useState(null);
  const [hyp, setHyp] = useState({thermal:0.25, osmotic:0.20, growth:1.0});
  const [busy, setBusy] = useState(false);
  const [prog, setProg] = useState(0);
  const [run, setRun] = useState(null);
  const [err, setErr] = useState(null);
  const [tab, setTab] = useState("p-seq");
  const [usageOv, setUsageOv] = useState({});
  const [highOv, setHighOv] = useState({});
  const [buildRep, setBuildRep] = useState({});
  const [fasta, setFasta] = useState("");
  const [fastaTgt, setFastaTgt] = useState("avg");
  const [pasteTbl, setPasteTbl] = useState("");
  const [pareto, setPareto] = useState(null);
  const [axes, setAxes] = useState({x:"cai", y:"struct"});
  const [ptSel, setPtSel] = useState(null);
  const [pBusy, setPBusy] = useState(false);
  const [selfRes, setSelfRes] = useState(null);
  const [copied, setCopied] = useState(false);
  const [dirty, setDirty] = useState(false);   // settings moved since the last run
  const trackRef = useRef(null);
  useTrackTips(trackRef);

  // cardinal values are editable, so the organism in play may differ from the file
  const org = useMemo(() => {
    if (!organisms || !orgId || !organisms[orgId]) return null;
    const base = organisms[orgId], ov = cardinalOv[orgId];
    return ov ? Object.assign({}, base, {cardinal: ov}) : base;
  }, [organisms, orgId, cardinalOv]);

  useEffect(() => {
    if (hostOrg && !orgTouched && hostOrg.id !== orgId) setOrgId(hostOrg.id);
    else if (!orgId && orgList.length) setOrgId(orgList[0].id);
  }, [hostOrg, orgTouched, orgId, orgList]);

  useEffect(() => {
    if (org && envOrg !== org.id) {
      const c = org.cardinal;
      setEnv({temp:c.T.opt, ph:c.pH.opt, salt:c.salt.opt, oxygen:"aerobic"});
      setEnvOrg(org.id);
    }
  }, [org, envOrg]);

  const parsed = useMemo(() => (C && raw.trim()) ? C.parseInput(raw) : null, [C, raw]);
  const aa = parsed && !parsed.error ? parsed.aa : null;
  const usage = org ? (usageOv[org.id] || org.usage) : null;
  const asmEnzymes = useMemo(
    () => (C && template) ? C.enzymesForAssembly(template.assembly) : [], [C, template]);

  const optsFor = () => ({
    typeIIS: cons.typeIIS, cloning: cons.cloning, internalSD: cons.internalSD,
    avoidRepeats: cons.avoidRepeats,
    maxHomopolymer: Math.max(3, +cons.maxHomopolymer || 5),
    gcMin: (+cons.gcMin || 30) / 100,
    gcMax: (+cons.gcMax || 72) / 100,
    enzymes: asmEnzymes,
    custom: cons.custom.toUpperCase().split(/[,\s]+/).map(s => s.replace(/[^ACGT]/g,"")).filter(s => s.length >= 4),
    hypotheses: hyp,
    usageOverride: org ? usageOv[org.id] : null,
    usageHighOverride: org ? highOv[org.id] : null,
  });

  // the chain needs no codon table, so it works even for an organism with none
  const dw = useMemo(() => (C && org) ? C.defaultWeights(org, env) : null, [C, org, env]);
  const weights = (autoW || !manualW) ? (dw && dw.weights) : manualW;
  const ctxPrev = useMemo(() => {
    if (!C || !org || !usage || !weights) return null;
    try { return C.makeContext(org, env, optsFor(), weights, aa); } catch (e) { return null; }
  }, [C, org, usage, weights, env, aa, cons, hyp, asmEnzymes, usageOv, highOv]);

  /* Two kinds of change. A new sequence or organism makes the old result
     meaningless, so it is thrown away. A condition, weight or hypothesis
     change leaves the result valid for the settings it was run under, so
     Reef Codon kept it on screen - but then the chain above describes
     settings the numbers below were not computed with, which is why the
     result is flagged stale rather than silently left to look current. */
  const invalidate = () => { setRun(null); setErr(null); setPareto(null); setPtSel(null); setDirty(false); };
  const touch = () => { setDirty(true); setPareto(null); setPtSel(null); };

  const runOptimize = async (wOverride) => {
    if (!C || !org || !aa || busy) return;
    setBusy(true); setErr(null); setProg(0);
    try {
      const o = optsFor();
      const w = wOverride || weights || C.defaultWeights(org, env).weights;
      const ctx = C.makeContext(org, env, o, w, aa);
      const lockN = Math.min(+cons.lockN || 0, aa.length);
      const locked = new Array(aa.length).fill(null);
      if (lockN > 0 && parsed.type === "dna")
        for (let i = 0; i < lockN; i++) locked[i] = parsed.codons[i];
      // The stop codon is held fixed. Swapping it to satisfy a composition
      // target is a bad trade: readthrough behaviour differs between stops,
      // and TGA is reassigned in some contexts.
      const last = aa.length - 1;
      if (aa[last] === "*")
        locked[last] = parsed.type === "dna" ? parsed.codons[last] : C.bestStop(ctx.usage);

      const res = await C.optimizeAsync(aa, ctx, locked, {}, f => setProg(f));
      const refCodons = parsed.type === "dna" ? parsed.codons : C.baselineMaxCAI(aa, ctx.wHigh);
      const refLabel = parsed.type === "dna" ? "Your input" : "Most-frequent-codon draft";
      setRun({
        ctx, aa, res, lockN, locked, refCodons, refLabel,
        refEval: C.evaluate(refCodons, ctx),
        changes: C.attributeChanges(aa, refCodons, res.codons, ctx),
        inputType: parsed.type, inputCodons: parsed.type === "dna" ? parsed.codons.slice() : null,
      });
      setDirty(false); setPareto(null); setPtSel(null); setTab("p-seq");
    } catch (e) { setErr(e.message); setRun(null); }
    finally { setBusy(false); setProg(0); }
  };

  const sampleWeights = () => {
    if (!run) return;
    setPBusy(true);
    setTimeout(() => {
      try {
        setPareto(C.paretoSweep(run.aa, run.ctx.org, run.ctx.env, optsFor(), run.locked, 36));
      } catch (e) { setErr(e.message); }
      setPBusy(false);
    }, 20);
  };

  const buildTable = () => {
    const out = C.codonUsageFromFasta(fasta);
    if (out.error) { setBuildRep(m => ({...m, [org.id]:{cls:"bad", text:out.error}})); return; }
    const st = out.stats;
    const slot = fastaTgt === "high" ? "highly-expressed reference" : "genome average";
    const bits = [`[${slot}] Counted ${st.codons.toLocaleString()} codons from ${st.used} sequences.`];
    let cls = "ok";
    if (st.codons < 20000) {
      cls = "bad";
      bits.push("Enough to load, but a stable genome table usually needs a few hundred thousand codons — treat this one as provisional.");
    }
    if (st.skippedFrame || st.skippedInternalStop || st.skippedAmbiguous)
      bits.push(`Rejected ${st.skippedFrame} out-of-frame, ${st.skippedInternalStop} with internal stops, ${st.skippedAmbiguous} with ambiguous bases.`);
    if (st.emptyFamilies)
      bits.push(`${st.emptyFamilies} amino acid(s) never appeared; those families were left uniform.`);
    setBuildRep(m => ({...m, [org.id]:{cls, text:bits.join(" ")}}));
    if (fastaTgt === "high") setHighOv(m => ({...m, [org.id]: out.usage}));
    else setUsageOv(m => ({...m, [org.id]: out.usage}));
    invalidate();
  };

  const applyPasted = () => {
    const t = C.parseUsageText(pasteTbl);
    const k = Object.keys(t).length;
    if (k < 40) { setBuildRep(m => ({...m, [org.id]:{cls:"bad", text:`Only ${k} codons were recognized. A usable table needs at least 40.`}})); return; }
    for (const c of Object.keys(C.CODON_AA)) if (!(c in t)) t[c] = 0.01;
    setUsageOv(m => ({...m, [org.id]: C.normalizeUsage(t)}));
    setBuildRep(m => ({...m, [org.id]:{cls:"ok", text:`Applied a pasted table: ${k} codons recognized, normalised to within-family fractions.`}}));
    invalidate();
  };

  const resetTable = () => {
    setUsageOv(m => { const n = {...m}; delete n[org.id]; return n; });
    setHighOv(m => { const n = {...m}; delete n[org.id]; return n; });
    setBuildRep(m => { const n = {...m}; delete n[org.id]; return n; });
    invalidate();
  };

  const setW = (k, v) => {
    const rawW = {}; let z = 0;
    for (const j of C.TERM_KEYS) {
      rawW[j] = Math.max(0.001, j === k ? +v : (weights ? weights[j] : 0.2));
      z += rawW[j];
    }
    const out = {};
    for (const j of C.TERM_KEYS) out[j] = rawW[j] / z;
    setManualW(out); touch();
  };

  const editCardinal = (key, bound, value) => {
    const base = organisms[orgId].cardinal;
    const cur = cardinalOv[orgId] ? JSON.parse(JSON.stringify(cardinalOv[orgId])) : JSON.parse(JSON.stringify(base));
    cur[key][bound] = parseFloat(value);
    // keep min < opt < max, otherwise the gamma model is undefined
    if (!(cur[key].min < cur[key].opt && cur[key].opt < cur[key].max)) {
      setCardNote("Cardinal values must satisfy min < opt < max. Reverted that edit.");
      return false;
    }
    setCardNote(""); setCardinalOv(m => ({...m, [orgId]: cur})); touch();
    return true;
  };

  /* The accepted CDS is shaped like a parts.json record so designer.js can
     slot it straight in. Evidence is inherited, never upgraded: optimizing a
     placeholder does not turn it into a verified sequence. */
  const accept = () => {
    const r = run, seq = r.res.result.seq;
    const label = srcRec ? srcRec.name : "pasted sequence";
    const prov = usageOv[org.id] ? "codon table counted from CDS you supplied"
                                 : (org.table.source || "no bundled table");
    onAccept({
      id: "opt_" + (srcRec ? srcRec.id : "pasted") + "_" + org.id,
      name: label + " · optimized for " + org.short,
      type: "cds",
      seq, length: seq.length, gc: +gcCalc(seq).toFixed(1),
      desc: `Synonymous recoding of ${label} for ${org.name} ${org.strain}`
          + ` at ${env.temp} °C, pH ${env.ph}, ${env.salt}% NaCl, ${env.oxygen}.`
          + ` Protein unchanged (${r.aa.length} codons). F=${r.res.result.total.toFixed(3)},`
          + ` CAI=${r.res.result.terms.cai.toFixed(3)}, GC=${pctS(r.res.result.gc)},`
          + ` ${r.res.result.violations.total} unresolved constraint hit(s).`,
      src: (srcRec ? `Recoded from ${srcRec.name} (${srcRec.id}); original source: ${srcRec.src}`
                   : "Recoded from a sequence pasted into the builder by the user")
         + ` — codon.js ${r.res.stage}, ${prov}`,
      evidence: srcRec ? (srcRec.evidence === "verified" ? "verified" : "placeholder") : "verified",
      hosts: {},
      optimized: {
        orgId: org.id, orgShort: org.short, host: template ? template.host : null,
        env: Object.assign({}, env), stage: r.res.stage, result: r.res.result,
        refLabel: r.refLabel, tableStatus: usageOv[org.id] ? "built" : org.table.status,
        highStatus: r.ctx.highSource.status,
        changed: r.changes.filter(c => c.changed).length, codons: r.aa.length,
      },
    });
  };

  if (!C) return (
    <div style={{background:"#2a0a0a",border:"1px solid #b91c1c",borderRadius:8,padding:"12px 14px",color:"#fca5a5",fontSize:12}}>
      ./codon.js did not load — the page must be served over http, not opened as a file.
    </div>
  );
  if (!organisms || !org) return (
    <div style={{fontSize:12,color:"#475569",padding:"14px"}}>Loading codon tables…</div>
  );

  const phys = dw.phys, card = org.cardinal;
  const tone = v => v > .7 ? "g" : v > .3 ? "" : "r";
  const MU_C = 2 * Math.PI * 34;
  const hostMismatch = accepted && accepted.optimized && hostOrg
    && accepted.optimized.orgId !== hostOrg.id;

  return (
    <div className="rc">
      <header className="topbar">
        <div className="brand">
          <svg className="polyp" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="3.1" fill="var(--rfp)"/>
            <g stroke="var(--cfp)" strokeWidth="1.5" strokeLinecap="round">
              <path d="M12 8.9V2.6"/><path d="M12 15.1v6.3"/>
              <path d="M8.9 12H2.6"/><path d="M15.1 12h6.3"/>
              <path d="M9.8 9.8 5.3 5.3"/><path d="M14.2 14.2l4.5 4.5"/>
              <path d="M14.2 9.8l4.5-4.5"/><path d="M9.8 14.2l-4.5 4.5"/>
            </g>
          </svg>
          <div>
            <h1>Codon optimization</h1>
            <p>step 00 · environment-aware synonymous recoding</p>
          </div>
        </div>
        <button className="run" onClick={runOptimize} disabled={!aa || busy}>
          {busy ? "Optimizing…" : "Optimize sequence"}
        </button>
      </header>

      <nav className="orgbar" role="tablist" aria-label="Target organism">
        {orgList.map(o => (
          <button key={o.id} role="tab" aria-selected={o.id === orgId}
            onClick={()=>{setOrgId(o.id); setOrgTouched(true); invalidate();}}>
            <div className="nm"><i style={{background:o.accent}}/>{o.name}</div>
            <div className="sub">{o.strain}</div>
          </button>
        ))}
      </nav>

      {/* signature element: environment → physiology → objective weights */}
      <section className="chain" aria-label="Physiology chain">
        <div className="chain-head">
          <span className="eyebrow">Physiology chain</span>
          <p>
            {phys.mu < 0.02
              ? `These conditions fall outside the tolerated range for ${org.short}, so the growth-rate coupling is switched off and the weights fall back to composition and constraints.`
              : `At ${(+env.temp).toFixed(0)} °C, pH ${(+env.ph).toFixed(1)}, ${(+env.salt).toFixed(1)}% NaCl, ${org.short} is predicted to run at ${Math.round(phys.mu*100)}% of its maximum growth rate.`}
            {ctxPrev
              ? ` Target GC3 shifts from ${pctS(ctxPrev.gc3Genome)} to ${pctS(ctxPrev.gc3Target)}.`
              : " No codon table is loaded, so no GC3 target can be computed."}
          </p>
        </div>
        <div className="chain-inner">
          <div className="chain-col">
            <span className="chain-lab">Conditions</span>
            <Factor name="Temp" value={(+env.temp).toFixed(1)+" °C"} tone="a"
              frac={(env.temp-card.T.min)/(card.T.max-card.T.min)}/>
            <Factor name="pH" value={(+env.ph).toFixed(1)} tone="a"
              frac={(env.ph-card.pH.min)/(card.pH.max-card.pH.min)}/>
            <Factor name="NaCl" value={(+env.salt).toFixed(1)+" %"} tone="a"
              frac={(env.salt-card.salt.min)/(card.salt.max-card.salt.min)}/>
            <Factor name="O₂" value={env.oxygen.slice(0,5)} tone="a" frac={org.oxygen[env.oxygen]}/>
          </div>
          <div className="chain-arrow" aria-hidden="true">→</div>
          <div className="chain-col">
            <span className="chain-lab">Cardinal response γ</span>
            <Factor name="γ temp" value={f3(phys.gT)} frac={phys.gT} tone={tone(phys.gT)}/>
            <Factor name="γ pH" value={f3(phys.gP)} frac={phys.gP} tone={tone(phys.gP)}/>
            <Factor name="γ salt" value={f3(phys.gS)} frac={phys.gS} tone={tone(phys.gS)}/>
            <Factor name="γ O₂" value={f3(phys.gO)} frac={phys.gO} tone={tone(phys.gO)}/>
          </div>
          <div className="chain-arrow" aria-hidden="true">→</div>
          <div className="mu">
            <svg width="86" height="86" viewBox="0 0 86 86" aria-hidden="true">
              <circle cx="43" cy="43" r="34" fill="none" stroke="var(--shelf)" strokeWidth="7"/>
              <circle cx="43" cy="43" r="34" fill="none" strokeWidth="7" strokeLinecap="round"
                stroke={phys.mu > .7 ? "var(--gfp)" : phys.mu > .25 ? "var(--cfp)" : "var(--rfp)"}
                strokeDasharray={MU_C} strokeDashoffset={MU_C * (1 - phys.mu)}
                transform="rotate(-90 43 43)"
                style={{transition:"stroke-dashoffset .45s cubic-bezier(.2,.8,.3,1), stroke .3s"}}/>
              <text x="43" y="48" textAnchor="middle" fill="var(--foam)"
                style={{font:"700 19px system-ui,sans-serif"}}>
                {phys.mu < 0.001 ? "0" : phys.mu.toFixed(2)}
              </text>
            </svg>
            <span className="cap">μ / μ<sub>max</sub><br/>predicted</span>
          </div>
          <div className="chain-arrow" aria-hidden="true">→</div>
          <div className="chain-col">
            <span className="chain-lab">Objective weights</span>
            <div className="wstack">
              {C.TERM_KEYS.map(k => (
                <i key={k} className={TERM_META[k].cls} style={{width:weights[k]*100+"%"}}
                  title={TERM_META[k].label + " " + pctS(weights[k])}/>
              ))}
            </div>
            <div className="wkey">
              {C.TERM_KEYS.map(k => (
                <span key={k}><b className={TERM_META[k].cls}/>
                  {TERM_META[k].label.toLowerCase()} {Math.round(weights[k]*100)}%</span>
              ))}
            </div>
          </div>
        </div>
      </section>

      <main className="layout">
        {/* ── controls ───────────────────────────────────────────────── */}
        <aside className="rail">
          <div className="block">
            <h3>Sequence</h3>
            <textarea value={raw} spellCheck={false}
              onChange={e=>{setRaw(e.target.value); setSrcRec(null); invalidate();}}
              placeholder="Paste a coding sequence (DNA) or a protein sequence in one-letter code. FASTA headers are ignored."/>
            <div style={{marginTop:8}}>
              <PartCombo pool={cdsPool}
                placeholder={`Load a CDS from the catalog (${cdsPool.length.toLocaleString()})…`}
                onPick={rec=>{setSrcRec(rec); setRaw(rec.seq || ""); invalidate();}}
                hint="no CDS match"/>
            </div>
            <div className="chips">
              <button className="chip" onClick={()=>{setRaw(""); setSrcRec(null); invalidate();}}>Clear</button>
            </div>
            <div className={"status" + (!parsed ? "" : parsed.error ? " bad" : " ok")}>
              <span>
                {!parsed ? "Waiting for a sequence."
                  : parsed.error ? parsed.error
                  : `${parsed.type === "dna" ? "DNA" : "Protein"} · ${parsed.aa.length} codons · ${parsed.aa.length*3} bp`
                    + (parsed.hasStop ? " · stop included" : " · no stop codon")
                    + (srcRec ? " · " + srcRec.name : "")}
              </span>
            </div>
            {busy && <div className="progress"><i style={{width:prog*100+"%"}}/></div>}
          </div>

          <div className="block">
            <h3>Growth conditions</h3>
            {[["temp","Temperature",0,60,.5,v=>v.toFixed(1)+" °C"],
              ["ph","pH",3,12,.1,v=>v.toFixed(1)],
              ["salt","NaCl",0,26,.1,v=>v.toFixed(1)+" % w/v"]].map(([k,label,lo,hi,step,fmt])=>(
              <div className="slider" key={k}>
                <div className="top"><span className="k">{label}</span><span className="v">{fmt(+env[k])}</span></div>
                <input type="range" min={lo} max={hi} step={step} value={env[k]}
                  onChange={e=>{setEnv(v=>Object.assign({},v,{[k]:+e.target.value})); touch();}}/>
              </div>
            ))}
            <div className="row">
              <label className="eyebrow" style={{flex:"none"}}>Oxygen</label>
              <select value={env.oxygen} title={org.oxygenNote||""}
                onChange={e=>{setEnv(v=>Object.assign({},v,{oxygen:e.target.value})); touch();}}>
                <option value="aerobic">Aerobic</option>
                <option value="microaerobic">Microaerobic</option>
                <option value="anaerobic">Anaerobic</option>
              </select>
            </div>
            <div className="chips">
              {Object.entries(ENV_PRESETS).map(([k,p])=>(
                <button key={k} className="chip"
                  onClick={()=>{setEnv(p.from(org)); touch();}}>{p.label}</button>
              ))}
            </div>
            <div className="cardgrid">
              <span/><span className="hd">min</span><span className="hd">opt</span><span className="hd">max</span>
              {[["T","Temp °C",0.5],["pH","pH",0.1],["salt","NaCl %",0.1]].map(([key,label,step])=>(
                <React.Fragment key={key}>
                  <label>{label}</label>
                  {["min","opt","max"].map(b=>(
                    <input key={b} type="number" step={step} value={card[key][b]}
                      onChange={e=>editCardinal(key,b,e.target.value)}/>
                  ))}
                </React.Fragment>
              ))}
            </div>
            <div className="chips">
              <button className="chip" onClick={()=>{
                setCardinalOv(m=>{const n={...m}; delete n[orgId]; return n;});
                setCardNote(""); touch();
              }}>Reset to reference values</button>
            </div>
            <p className="hint">
              {cardNote || `${org.short} cardinal values — temperature ${card.T.min}/${card.T.opt}/${card.T.max} °C,`
                + ` pH ${card.pH.min}/${card.pH.opt}/${card.pH.max},`
                + ` NaCl ${card.salt.min}/${card.salt.opt}/${card.salt.max} % w/v (min/opt/max).`}
            </p>
          </div>

          <div className="block">
            <h3>Design constraints</h3>
            {[["typeIIS","Remove Type IIS sites","BsaI, BbsI, BsmBI, SapI — keeps Golden Gate assembly clean"],
              ["cloning","Remove common cloning sites","EcoRI, BamHI, HindIII, XhoI, NdeI, SalI, XbaI, NotI"],
              ["internalSD", org.hostClass === "yeast" ? "Remove premature poly(A) signals" : "Remove internal ribosome binding sites",
                org.hostClass === "yeast"
                  ? "TAYRTA efficiency elements, weaker T/A-rich variants and the AATAAA positioning element, which can cut the transcript short inside the ORF"
                  : "AGGAGG-like motifs that can start translation mid-gene"],
              ["avoidRepeats","Break exact 12 bp repeats","Reduces synthesis failures and recombination"]].map(([k,t,sub])=>(
              <label className="check" key={k}>
                <input type="checkbox" checked={cons[k]}
                  onChange={e=>{setCons(c=>Object.assign({},c,{[k]:e.target.checked})); touch();}}/>
                <span>{t}<small>{sub}</small></span>
              </label>
            ))}
            <p className="hint" style={{margin:"0 0 4px"}}>
              The stop codon is always held fixed.
              {template && (asmEnzymes.length
                ? ` This template assembles by ${template.assembly}, so ${asmEnzymes.join(" and ")} are removed automatically too.`
                : ` This template assembles by ${template.assembly}, which is scarless — no extra sites are forced on the insert.`)}
            </p>
            <div className="row" style={{marginTop:12}}>
              <label className="eyebrow" style={{flex:1}}>Longest single-base run</label>
              <input type="number" min={3} max={10} value={cons.maxHomopolymer} style={{width:66}}
                onChange={e=>{setCons(c=>Object.assign({},c,{maxHomopolymer:e.target.value})); touch();}}/>
            </div>
            <div className="row">
              <label className="eyebrow" style={{flex:1}}>Keep first N codons unchanged</label>
              <input type="number" min={0} max={60} value={cons.lockN} style={{width:66}}
                onChange={e=>{setCons(c=>Object.assign({},c,{lockN:e.target.value})); touch();}}/>
            </div>
            <div className="row">
              <label className="eyebrow" style={{flex:1}}>GC range %</label>
              <input type="number" min={15} max={85} value={cons.gcMin} style={{width:60}}
                onChange={e=>{setCons(c=>Object.assign({},c,{gcMin:e.target.value})); touch();}}/>
              <input type="number" min={15} max={85} value={cons.gcMax} style={{width:60}}
                onChange={e=>{setCons(c=>Object.assign({},c,{gcMax:e.target.value})); touch();}}/>
            </div>
            <div className="row">
              <input type="text" value={cons.custom} placeholder="Extra motifs to avoid, comma separated"
                onChange={e=>{setCons(c=>Object.assign({},c,{custom:e.target.value})); touch();}}/>
            </div>
          </div>

          <div className="block">
            <h3>Objective weights</h3>
            <label className="check">
              <input type="checkbox" checked={autoW}
                onChange={e=>{setAutoW(e.target.checked); if (e.target.checked) setManualW(null); touch();}}/>
              <span>Set weights from growth conditions<small>Uncheck to steer the trade-off by hand</small></span>
            </label>
            {C.TERM_KEYS.map(k=>(
              <div className="slider" key={k}>
                <div className="top">
                  <span className="k">{TERM_META[k].label}</span>
                  <span className="v">{Math.round(weights[k]*100)}%</span>
                </div>
                <input type="range" min={0} max={1} step={0.01} value={weights[k]} disabled={autoW}
                  onChange={e=>setW(k, e.target.value)}/>
              </div>
            ))}
          </div>

          <div className="block">
            <h3>Environment hypotheses</h3>
            <p className="hint" style={{margin:"0 0 14px"}}>
              Three coupling coefficients connect conditions to codon choice. Set one to zero to drop that
              hypothesis and re-run — that comparison is the experiment.
            </p>
            {[["thermal","Thermal → GC3",-0.6,0.6],
              ["osmotic","Osmotic → GC3",-0.6,0.6],
              ["growth","Growth rate → tRNA pool",0,1]].map(([k,label,lo,hi])=>(
              <div className="slider" key={k}>
                <div className="top"><span className="k">{label}</span><span className="v">{(+hyp[k]).toFixed(2)}</span></div>
                <input type="range" min={lo} max={hi} step={0.01} value={hyp[k]}
                  onChange={e=>{setHyp(h=>Object.assign({},h,{[k]:+e.target.value})); touch();}}/>
              </div>
            ))}
          </div>
        </aside>

        {/* ── results ────────────────────────────────────────────────── */}
        <section className="results">
          <div className="tabs" role="tablist">
            {[["p-seq","Sequence"],["p-obj","Objectives"],["p-par","Trade-offs"],["p-ben","Benchmark"],
              ["p-cu","Codon tables"],["p-ver","Verification"],["p-meth","Method & limits"]].map(([id,l])=>(
              <button key={id} role="tab" aria-selected={tab===id} onClick={()=>setTab(id)}>{l}</button>
            ))}
          </div>

          <div className="pane">
            {err && (
              <div className="banner" style={{borderLeftColor:"var(--rfp)"}}>
                <div><strong>The optimizer could not run.</strong>{err}</div>
              </div>
            )}

            {tab === "p-seq" && (
              <RcSeqPane run={run} org={org} usageOv={usageOv} ctxPrev={ctxPrev} trackRef={trackRef}
                copied={copied} setCopied={setCopied} accepted={accepted} onAccept={accept}
                onClear={onClear} hostMismatch={hostMismatch} template={template} dirty={dirty}/>
            )}
            {tab === "p-obj" && <RcObjPane run={run}/>}
            {tab === "p-par" && (
              <RcParPane run={run} pareto={pareto} pBusy={pBusy} axes={axes} setAxes={setAxes}
                ptSel={ptSel} setPtSel={setPtSel} onSample={sampleWeights}
                onAdopt={w=>{
                  // adopt the point's weights and re-optimize under them; the
                  // state update has not landed yet, so pass them explicitly
                  const adopted = Object.assign({}, w);
                  setAutoW(false); setManualW(adopted); runOptimize(adopted);
                }}/>
            )}
            {tab === "p-ben" && <RcBenPane run={run} org={org}/>}
            {tab === "p-cu" && (
              <RcCuPane org={org} usageOv={usageOv} highOv={highOv} buildRep={buildRep}
                fasta={fasta} setFasta={setFasta} fastaTgt={fastaTgt} setFastaTgt={setFastaTgt}
                pasteTbl={pasteTbl} setPasteTbl={setPasteTbl}
                onBuild={buildTable} onApply={applyPasted} onReset={resetTable}/>
            )}
            {tab === "p-ver" && (
              <RcVerPane organisms={organisms} usageOv={usageOv} highOv={highOv}
                selfRes={selfRes} setSelfRes={setSelfRes}/>
            )}
            {tab === "p-meth" && <RcMethPane/>}
          </div>
        </section>
      </main>
    </div>
  );
}

/* Warnings that must travel with every result for this host. */
function RcBanners({ org, usageOv, ctxPrev }) {
  const out = [];
  if (!usageOv[org.id] && org.table.status === "none") out.push(
    <div className="banner" key="none" style={{borderLeftColor:"var(--rfp)"}}>
      <div><strong>No codon table on file for {org.name}.</strong>{org.table.note}</div>
    </div>);
  else if (!usageOv[org.id] && org.table.status === "provisional") out.push(
    <div className="banner" key="prov">
      <div><strong>{org.name} is using a provisional codon table.</strong>{org.table.note}
        {" "}Until you load a real table, treat the CAI and environment-fit numbers for this organism as
        placeholders and read only the GC, folding and constraint results.</div>
    </div>);
  if (ctxPrev && ctxPrev.highSource.status === "heuristic") out.push(
    <div className="banner" key="heur">
      <div><strong>CAI here uses a heuristic reference set.</strong> CAI is properly defined against highly
        expressed genes, and no measured reference set is loaded for {org.short}, so the tool sharpened the
        genome average instead. That amplifies whatever bias is already present, including bias that is
        mutational rather than selective. For E. coli the two disagree on the best codon in 10 of 18 families,
        so the gap is not academic. Load ribosomal-protein CDS in the Codon tables panel to replace it.</div>
    </div>);
  if (org.hostClass === "yeast") out.push(
    <div className="banner euk" key="euk">
      <div><strong>{org.short} is a eukaryote.</strong> The Shine-Dalgarno rule does not apply, so the
        initiation-motif constraint switches to premature poly(A) signals instead — the TAYRTA efficiency
        elements and the AATAAA positioning element. Translation initiates by cap-dependent scanning, which
        means Kozak context and 5′ structure matter, while the growth-rate and tRNA-pool reasoning is
        unchanged. Nuclear export, intron-like signals and secretion routing are not modelled at all.</div>
    </div>);
  return out;
}

function RcSeqPane({ run, org, usageOv, ctxPrev, trackRef, copied, setCopied,
                     accepted, onAccept, onClear, hostMismatch, template, dirty }) {
  const C = window.Codon;
  if (!run) return (
    <>
      <RcBanners org={org} usageOv={usageOv} ctxPrev={ctxPrev}/>
      <RcEmpty title="Nothing optimized yet">
        Paste a coding sequence or load one from the catalog, set the growth conditions, then run the optimization.
      </RcEmpty>
    </>
  );
  const o = run.res.result, r = run.refEval;
  const changed = run.changes.filter(c => c.changed).length;
  const arrow = (a, b, better="up") => {
    const d = b - a;
    if (Math.abs(d) < 0.0005) return ["no change","flat"];
    const good = better === "up" ? d > 0 : d < 0;
    return [(d>0?"+":"")+d.toFixed(3)+" vs "+run.refLabel.toLowerCase(), good?"up":"down"];
  };
  const m = [];
  let a = arrow(r.total, o.total);            m.push(["Objective F", o.total.toFixed(3), a[0], a[1]]);
  a = arrow(r.terms.cai, o.terms.cai);        m.push(["CAI", o.terms.cai.toFixed(3), a[0], a[1]]);
  m.push(["GC content", pctS(o.gc), (o.gc>r.gc?"+":"")+((o.gc-r.gc)*100).toFixed(1)+" pts", "flat"]);
  a = arrow(r.foldP, o.foldP, "down");        m.push(["5′ folded fraction", o.foldP.toFixed(3), a[0], a[1]]);
  m.push(["Constraint hits", String(o.violations.total), `was ${r.violations.total}`,
    o.violations.total < r.violations.total ? "up" : o.violations.total > r.violations.total ? "down" : "flat"]);
  m.push(["Codons changed", `${changed} / ${run.changes.length}`, pctS(changed/run.changes.length)+" of sequence", "flat"]);

  const fastaOut = () =>
    `>optimized|${run.ctx.org.name} ${run.ctx.org.strain}|T=${run.ctx.env.temp}C pH=${run.ctx.env.ph}`
    + ` NaCl=${run.ctx.env.salt}% O2=${run.ctx.env.oxygen}|F=${o.total.toFixed(4)}`
    + ` CAI=${o.terms.cai.toFixed(3)} GC=${pctS(o.gc)}\n` + o.seq.replace(/(.{60})/g, "$1\n");
  const csvOut = () => {
    const rows = [["position","amino_acid","reference_codon","optimized_codon","changed","dominant_driver",
                   "w_highly_expressed","w_genome","w_environment","gc3"]];
    for (const c of run.changes) rows.push([c.i+1, c.aa, c.old, c.new, c.changed?"yes":"no",
      c.changed?TERM_META[c.driver].label:"", f3(run.ctx.wHigh[c.new]), f3(run.ctx.wGenome[c.new]),
      f3(run.ctx.wEnv[c.new]), C.isGC3(c.new)]);
    return rows.map(x => x.join(",")).join("\n");
  };

  return (
    <>
      <RcBanners org={org} usageOv={usageOv} ctxPrev={ctxPrev}/>

      {dirty && (
        <div className="banner">
          <div><strong>Settings changed since this run.</strong>The physiology chain above now describes
            conditions these numbers were not computed under. Press Optimize sequence to bring them back
            into agreement.</div>
        </div>
      )}

      <div className="metrics">
        {m.map(([k,v,d,cls])=>(
          <div className="metric" key={k}>
            <div className="k">{k}</div><div className="v">{v}</div><div className={"d "+cls}>{d}</div>
          </div>
        ))}
      </div>

      <div className="tracklegend">
        <span>Colour marks the term that gained most from each change:</span>
        {C.TERM_KEYS.map(k => (
          <span key={k}><b className={TERM_META[k].cls}/>{TERM_META[k].label.toLowerCase()}</span>
        ))}
      </div>

      <div className="track" ref={trackRef}>
        {run.changes.map(c => (
          <div key={c.i}
            className={"cod" + (c.changed ? " ch" : "") + (run.lockN && c.i < run.lockN ? " lock" : "")}
            data-d={c.changed ? c.driver : undefined}
            title={c.changed
              ? `Codon ${c.i+1} ${C.AA_NAMES[c.aa]||c.aa}: ${c.old} to ${c.new}, driven by ${TERM_META[c.driver].label}`
              : `Codon ${c.i+1} ${C.AA_NAMES[c.aa]||c.aa}: ${c.new}, unchanged`}
            data-tip={`<b>Codon ${c.i+1} · ${C.AA_NAMES[c.aa]||c.aa}</b><br>`
              + (c.changed ? `${c.old} → <em>${c.new}</em><br>` : `${c.new} — unchanged<br>`)
              + `w = ${f3(run.ctx.wGenome[c.new])} · third position ${C.isGC3(c.new) ? "G/C" : "A/T"}`
              + (run.lockN && c.i < run.lockN ? "<br>locked by you" : "")
              + (c.deltas ? "<br>" + C.TERM_KEYS.filter(k=>Math.abs(c.deltas[k])>1e-6)
                  .sort((x,y)=>c.deltas[y]-c.deltas[x])
                  .map(k=>`${TERM_META[k].label}: ${c.deltas[k]>0?"+":""}${c.deltas[k].toFixed(3)}`)
                  .join("<br>") : "")}>
            <span className="aa">{C.AA_NAMES[c.aa]||c.aa}</span>
            <span className="was">{c.changed ? c.old : ""}</span>
            <span className="nt">{c.new}</span>
          </div>
        ))}
      </div>

      <div className="seqbox">
        <div className="bar">
          <span className="eyebrow">Optimized coding sequence — first 48 nt highlighted</span>
          <div className="chips">
            <button className="chip" onClick={()=>{navigator.clipboard.writeText(o.seq);setCopied(true);setTimeout(()=>setCopied(false),1800);}}>
              {copied ? "✓ Copied" : "Copy sequence"}
            </button>
            <button className="chip" onClick={()=>download("optimized_cds.fasta", fastaOut())}>Download FASTA</button>
            <button className="chip" onClick={()=>download("codon_report.csv", csvOut())}>Download codon report (CSV)</button>
          </div>
        </div>
        <div className="seqout">
          <span className="init">{o.seq.slice(0, C.INIT_WINDOW_NT)}</span>{o.seq.slice(C.INIT_WINDOW_NT)}
        </div>
      </div>

      {o.violations.total > 0 && (
        <div className="note">
          <strong>{o.violations.total} constraint hit(s) could not be removed.</strong>{" "}
          {o.violations.hits.slice(0,6).map(h=>`${h.text} at ${h.at+1}`).join(", ")}. These usually sit where
          the protein sequence itself forces the motif — relax a constraint or edit those residues.
        </div>
      )}

      {/* the handoff into step 01 */}
      <div className="handoff">
        <div className="txt">
          {accepted && accepted.optimized ? (
            <>
              <strong>✓ In use as the gene of interest</strong>
              {accepted.name} · {accepted.length.toLocaleString()} bp · GC {accepted.gc}% ·
              {" "}{accepted.optimized.changed} of {accepted.optimized.codons} codons changed
              {hostMismatch && (
                <span style={{display:"block",color:"var(--amber)",marginTop:4}}>
                  ⚠️ Optimized for {accepted.optimized.orgShort}, but the selected template targets {template.host}.
                  Re-optimize or switch templates.
                </span>
              )}
            </>
          ) : (
            <>
              <strong>Hand this CDS to the plasmid</strong>
              It becomes the gene of interest in step 01, filling the template's user-supplied CDS slot.
            </>
          )}
        </div>
        {accepted && accepted.optimized
          ? <button className="chip" onClick={onClear}>Discard</button>
          : null}
        <button className="take" onClick={onAccept}>
          {accepted && accepted.optimized ? "Replace with this run" : "Use this CDS →"}
        </button>
      </div>
    </>
  );
}

function RcObjPane({ run }) {
  const C = window.Codon;
  if (!run) return <RcEmpty title="No objective breakdown yet">Run an optimization to see how each term moved.</RcEmpty>;
  const o = run.res.result, r = run.refEval, w = run.ctx.weights, c = run.ctx;
  return (
    <>
      <Headed title="Objective terms">
        Each term is scaled to 0–1 and multiplied by its weight. F is the weighted sum:{" "}
        {o.total.toFixed(4)} against {r.total.toFixed(4)} for the reference.
      </Headed>
      {C.TERM_KEYS.map(k=>{
        const d = o.terms[k] - r.terms[k];
        return (
          <div className="obj" key={k}>
            <div className="name">{TERM_META[k].label}
              <small>{TERM_META[k].sub} · weight {Math.round(w[k]*100)}%</small></div>
            <div className="lanes">
              <div className="lane"><span className="t">ref</span>
                <div className="bar"><i style={{width:Math.max(0,Math.min(1,r.terms[k]))*100+"%"}}/></div></div>
              <div className="lane new"><span className="t">opt</span>
                <div className="bar"><i style={{width:Math.max(0,Math.min(1,o.terms[k]))*100+"%"}}/></div></div>
            </div>
            <div className="num">{o.terms[k].toFixed(3)}<br/>
              <span className={d>.0005?"up":d<-.0005?"down":"flat"}>{d>=0?"+":""}{d.toFixed(3)}</span></div>
          </div>
        );
      })}
      <table className="data" style={{marginTop:24}}>
        <thead><tr><th>Quantity</th><th>Reference</th><th>Optimized</th><th>Notes</th></tr></thead>
        <tbody>
          {[["GC content", pctS(r.gc), pctS(o.gc), `target ${pctS(c.gcTarget)}`],
            ["GC at third position", pctS(r.gc3), pctS(o.gc3), `target ${pctS(c.gc3Target)} (genome ${pctS(c.gc3Genome)})`],
            ["5′ window ΔG proxy", r.foldDG.toFixed(1), o.foldDG.toFixed(1), "kcal·mol⁻¹, salt and temperature corrected"],
            ["5′ folded fraction", r.foldP.toFixed(3), o.foldP.toFixed(3), "lower keeps the start codon accessible"],
            ["Restriction / motif hits", r.violations.motif, o.violations.motif, ""],
            ["Long single-base runs", r.violations.homo, o.violations.homo, `longer than ${c.opts.maxHomopolymer} nt`],
            ["Repeated 12-mers", r.violations.repeat, o.violations.repeat, ""]].map(row=>(
            <tr key={row[0]}><td className="lead">{row[0]}</td><td>{row[1]}</td><td>{row[2]}</td><td>{row[3]}</td></tr>
          ))}
        </tbody>
      </table>
    </>
  );
}

function RcParPane({ run, pareto, pBusy, axes, setAxes, ptSel, setPtSel, onSample, onAdopt }) {
  const C = window.Codon;
  if (!run) return <RcEmpty title="No trade-off surface yet">Run an optimization first, then sample the weight space.</RcEmpty>;

  const sel = (which, val) => (
    <label key={which}>{which === "x" ? "Horizontal axis" : "Vertical axis"}
      <select value={val} onChange={e=>setAxes(a=>Object.assign({},a,{[which]:e.target.value}))}>
        {C.TERM_KEYS.map(k=><option key={k} value={k}>{TERM_META[k].label}</option>)}
      </select>
    </label>
  );

  let body;
  if (!pareto) {
    body = <RcEmpty title="Weight space not sampled">
      Sampling runs the dynamic program 36 times with different weightings. It takes a few seconds.
    </RcEmpty>;
  } else {
    const pts = pareto.map(p => Object.assign({}, p, {x:p.terms[axes.x], y:p.terms[axes.y]}));
    for (const p of pts) p.front = !pts.some(q => q !== p
      && q.x >= p.x - 1e-9 && q.y >= p.y - 1e-9 && (q.x > p.x + 1e-9 || q.y > p.y + 1e-9));
    const W = 560, H = 380, mg = {l:56, r:18, t:16, b:46};
    const pad = arr => { const lo = Math.min(...arr), hi = Math.max(...arr); const s = (hi-lo) || 0.1; return [lo-s*.12, hi+s*.12]; };
    const [x0,x1] = pad(pts.map(d=>d.x)), [y0,y1] = pad(pts.map(d=>d.y));
    const sx = v => mg.l + (v-x0)/(x1-x0)*(W-mg.l-mg.r);
    const sy = v => H - mg.b - (v-y0)/(y1-y0)*(H-mg.t-mg.b);
    const cur = run.res.result;
    const nf = pts.filter(d=>d.front).length;
    const tickFont = {font:"400 10px monospace"};
    const labFont = {font:"500 11px monospace"};

    body = (
      <div className="paretowrap">
        <div>
          <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",maxWidth:W}}>
            {[0,1,2,3,4].map(i=>{
              const gy = mg.t + i*(H-mg.t-mg.b)/4, v = y1 - i*(y1-y0)/4;
              return (
                <g key={"y"+i}>
                  <line x1={mg.l} x2={W-mg.r} y1={gy} y2={gy} stroke="var(--shelf)" strokeWidth="1"/>
                  <text x={mg.l-9} y={gy+4} textAnchor="end" fill="var(--dim)" style={tickFont}>{v.toFixed(2)}</text>
                </g>
              );
            })}
            {[0,1,2,3,4].map(i=>{
              const gx = mg.l + i*(W-mg.l-mg.r)/4, v = x0 + i*(x1-x0)/4;
              return <text key={"x"+i} x={gx} y={H-mg.b+18} textAnchor="middle" fill="var(--dim)" style={tickFont}>{v.toFixed(2)}</text>;
            })}
            <text x={(mg.l+W-mg.r)/2} y={H-8} textAnchor="middle" fill="var(--silt)" style={labFont}>{TERM_META[axes.x].label}</text>
            <text x={14} y={(H-mg.b+mg.t)/2} textAnchor="middle" fill="var(--silt)" style={labFont}
              transform={`rotate(-90 14 ${(H-mg.b+mg.t)/2})`}>{TERM_META[axes.y].label}</text>
            {pts.map((d,i)=>(
              <circle key={i} className="pt" cx={sx(d.x)} cy={sy(d.y)} r={d.front?5.5:3.5}
                fill={d.front?"var(--cfp)":"none"} stroke={d.front?"var(--cfp)":"var(--dim)"}
                strokeWidth="1.4" opacity={d.front?1:.55}
                onClick={()=>setPtSel(d)} onMouseEnter={()=>setPtSel(d)}/>
            ))}
            <circle cx={sx(cur.terms[axes.x])} cy={sy(cur.terms[axes.y])} r="7" fill="none"
              stroke="var(--rfp)" strokeWidth="2"/>
            <text x={sx(cur.terms[axes.x])+12} y={sy(cur.terms[axes.y])+4} fill="var(--rfp)"
              style={{font:"500 10px monospace"}}>current</text>
          </svg>
          <p className="hint">
            {nf} of {pts.length} runs are non-dominated on these two axes. The ringed point is the sequence you currently have.
          </p>
        </div>
        <div className="ptinfo">
          <h4>Selected run</h4>
          {!ptSel ? "Hover or click a point." : (
            <>
              <dl>
                {C.TERM_KEYS.map(k=>(
                  <React.Fragment key={k}>
                    <dt>{TERM_META[k].label.toLowerCase()}</dt>
                    <dd>{ptSel.terms[k].toFixed(3)} · w {Math.round(ptSel.weights[k]*100)}%</dd>
                  </React.Fragment>
                ))}
                <dt>GC</dt><dd>{pctS(ptSel.gc)}</dd>
                <dt>constraint hits</dt><dd>{ptSel.violations}</dd>
              </dl>
              <button className="chip" style={{marginTop:12}} onClick={()=>onAdopt(ptSel.weights)}>
                Use these weights
              </button>
            </>
          )}
        </div>
      </div>
    );
  }

  return (
    <>
      <Headed title="Trade-off surface">
        Each point is a full optimization run under a different random weight vector. Filled points are
        non-dominated on the two axes you pick: nothing else beats them on both at once. Choosing among them
        is a judgement call, not a maths problem.
      </Headed>
      <div className="axisrow">
        {sel("x", axes.x)}{sel("y", axes.y)}
        <button className="chip" style={{alignSelf:"flex-end"}} disabled={pBusy} onClick={onSample}>
          {pBusy ? "Sampling…" : pareto ? "Resample (36 runs)" : "Sample the weight space (36 runs)"}
        </button>
      </div>
      {body}
    </>
  );
}

function RcBenPane({ run, org }) {
  const C = window.Codon;
  if (!run) return <RcEmpty title="No benchmark yet">Run an optimization to compare it against the standard baselines.</RcEmpty>;
  const ctx = run.ctx;
  const models = [
    {id:"A", name:"Random synonymous", note:"picks uniformly among synonyms", codons:C.baselineRandom(run.aa, 1)},
    {id:"B", name:"Most-frequent codon", note:"the usual “codon optimization”", codons:C.baselineMaxCAI(run.aa, ctx.wHigh)},
    {id:"C", name:"Environment-aware (this tool)", note:run.res.stage, codons:run.res.codons},
  ];
  if (run.inputCodons) models.unshift({id:"0", name:"Your input sequence", note:"unmodified", codons:run.inputCodons});
  const evals = models.map(m => Object.assign({}, m, {e:C.evaluate(m.codons, ctx)}));
  const bestF = Math.max(...evals.map(m=>m.e.total));
  return (
    <>
      <Headed title="Baseline comparison">
        Four designs for the same protein, all scored under the current model. This tests whether the
        environment-aware objective actually produces different, higher-scoring sequences — it does not test
        whether they express better. That needs measured data.
      </Headed>
      <table className="data">
        <thead><tr><th>Model</th><th>F</th><th>CAI</th><th>Env fit</th><th>GC fit</th><th>Open 5′</th><th>GC %</th><th>Hits</th></tr></thead>
        <tbody>
          {evals.map(m=>(
            <tr key={m.id} className={Math.abs(m.e.total-bestF)<1e-9 ? "best" : undefined}>
              <td className="lead">{m.id} · {m.name}<br/>
                <span style={{color:"var(--dim)",fontSize:10.5}}>{m.note}</span></td>
              <td>{m.e.total.toFixed(4)}</td><td>{m.e.terms.cai.toFixed(3)}</td>
              <td>{m.e.terms.env.toFixed(3)}</td><td>{m.e.terms.gc.toFixed(3)}</td>
              <td>{m.e.terms.struct.toFixed(3)}</td><td>{(m.e.gc*100).toFixed(1)}</td>
              <td>{m.e.violations.total}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="note">
        <strong>What would make this a result.</strong> Hold the protein fixed and vary only the model. Then
        take a published expression dataset for {org.short} where the coding sequences and measured protein or
        mRNA levels are both available, score every sequence with models B and C, and ask which score
        correlates better with the measurement on data the model never saw. Report the correlation and its
        confidence interval, not a single optimized gene.
      </div>
    </>
  );
}

function RcCuPane({ org, usageOv, highOv, buildRep, fasta, setFasta, fastaTgt, setFastaTgt,
                    pasteTbl, setPasteTbl, onBuild, onApply, onReset }) {
  const C = window.Codon;
  const usage = usageOv[org.id] || org.usage;
  const overridden = !!usageOv[org.id];
  const rep = buildRep[org.id];
  const w = usage ? C.relativeAdaptiveness(usage) : null;
  const rs = usage ? C.rscuTable(usage) : null;

  return (
    <>
      <Headed title={`${org.name} — ${org.strain}`}>
        {org.blurb} Genome GC {pctS(org.gcGenome)}.{" "}
        {usage
          ? "Values below are each codon's share within its synonymous family, so every family sums to 1."
          : "No codon table is loaded for this organism, so there is nothing to show below yet."}
      </Headed>

      <div className={"banner" + (overridden || org.table.status === "verified" ? " ok" : "")}

function RcVerPane({ organisms, usageOv, highOv, selfRes, setSelfRes }) {
