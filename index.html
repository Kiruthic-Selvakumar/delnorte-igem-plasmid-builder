<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Del Norte iGEM — Plasmid Builder</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;font-family:system-ui,-apple-system,sans-serif}
input,select,button,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import * as Designer from "./designer.js";
  window.Designer = Designer;
</script>
<script type="text/babel">
const { useState, useEffect, useLayoutEffect, useMemo, useRef } = React;

/* ── Delivery protocols (hardcoded per host) ───────────────────────────── */
const PROTOCOLS = {
  "B. subtilis": {
    method: "Natural competence transformation",
    steps: [
      "Grow B. subtilis overnight in LB; dilute 1:100 into competence medium (SpC) and grow to OD600 = 0.5–0.8.",
      "Add purified plasmid DNA (1–5 µg) and incubate 90 min at 37°C with shaking at 200 rpm.",
      "Plate 100 µL on LB agar + spectinomycin (100 µg/mL); incubate 16–18 h at 37°C.",
      "Screen 6–12 colonies by colony PCR with primers flanking the Lysqdvp001 insert.",
      "Confirm positive clones by Sanger sequencing; glycerol-stock at −80°C.",
      "Assess biofilm formation on coral-mimetic surfaces (calcium carbonate chips) to confirm colonization."
    ],
    selection: "Spectinomycin · 100 µg/mL",
    verification: "Colony PCR: Lys-F/Lys-R primers (~900 bp band); confirm with Sanger sequencing"
  },
  "V. natrigens": {
    method: "Electroporation",
    steps: [
      "Grow V. natrigens in LB + 2% NaCl to OD600 = 0.4–0.6 at 30°C; chill on ice 20 min.",
      "Wash cells 3× with ice-cold VN electroporation buffer (272 mM sucrose, 7 mM K-phosphate pH 7.4, 1 mM MgCl₂).",
      "Resuspend pellet in 200 µL electroporation buffer (~10¹⁰ cells/mL); mix with 100–500 ng plasmid.",
      "Transfer to 1 mm electroporation cuvette; pulse at 1.8 kV, 25 µF, 200 Ω (time constant ~5 ms).",
      "Immediately add 800 µL LB + 2% NaCl; recover 1 h at 30°C with gentle shaking.",
      "Plate on LB + 2% NaCl + kanamycin (50 µg/mL); colonies appear in 6–8 h at 30°C."
    ],
    selection: "Kanamycin · 50 µg/mL",
    verification: "Colony PCR: Lys-F/Lys-R primers (~900 bp band); verify by Sanger sequencing"
  }
};

/* ── Part presets ─────────────────────────────────────────────────────── */
const HOST_ALIAS = { "V. natriegens": "V. natrigens" };
const protocolFor = host => PROTOCOLS[HOST_ALIAS[host] || host] || null;

const FILL = {
  promoter:"#4ade80", operator:"#22d3ee", rbs:"#fbbf24", cds:"#60a5fa", signal:"#f472b6",
  terminator:"#f87171", marker:"#c084fc", origin:"#fb923c", orit:"#a3e635", other:"#64748b",
};
const EV = { verified:"#22c55e", placeholder:"#f97316" };
function EvidencePill({ evidence }) {
  const c = EV[evidence];
  if (!c) return null;
  return (
    <span
      title={evidence === "verified"
        ? "Sequence has a real source in ./data/parts.json"
        : "No verified sequence on file - needs a lab-confirmed sequence"}
      style={{fontSize:10,padding:"2px 7px",background:`${c}1a`,color:c,borderRadius:20,border:`1px solid ${c}33`,whiteSpace:"nowrap"}}
    >{evidence}</span>
  );
}
// roughly transcriptional order, then vector elements
const TYPES = ["promoter","operator","rbs","cds","signal","terminator","marker","origin","orit","other"];
const TYPE_MAP = {
  "Promoter":"promoter","RBS":"rbs","Endolysin":"cds","Terminator":"terminator",
  "Resistance":"marker","ori":"origin","origin":"origin","promoter":"promoter",
  "rbs":"rbs","cds":"cds","terminator":"terminator","marker":"marker",
};
function guessType(name) {
  const n = name.toLowerCase();
  if (n.includes("promoter")) return "promoter";
  if (n.includes("rbs") || n.includes("ribosome")) return "rbs";
  if (n.includes("endolysin") || n.includes("lysin") || n.includes("cds") || n.includes("gfp") || n.includes("mcherry")) return "cds";
  if (n.includes("terminator")) return "terminator";
  if (n.includes("resistance") || n.includes("kanr") || n.includes("ampr") || n.includes("spcr") || n.includes("cmr")) return "marker";
  if (n.includes("ori") || n.includes("origin")) return "origin";
  return "cds";
}
function gcCalc(seq) {
  if (!seq) return 0;
  const gc = [...seq].filter(c => c === "G" || c === "C").length;
  return (gc / seq.length) * 100;
}
function seqFor(entry, host) {
  if (!entry) return null;
  const variant = entry.hosts && entry.hosts[host];
  if (variant && "seq" in variant) return variant.seq;
  return entry.seq;
}
// template slot roles -> the existing type palette
const ROLE_TYPE = { ori:"origin", ori_shuttle:"origin", orit:"orit" };

function Section({ title, tone, children }) {
  return (
    <div style={{marginBottom:14}}>
      <div style={{fontSize:10,color:tone||"#475569",marginBottom:6,letterSpacing:.5,textTransform:"uppercase"}}>{title}</div>
      {children}
    </div>
  );
}

/* ── Searchable part dropdown ─────────────────────────────────────────
   Ranks name-prefix > name-substring > whole-word description match.
   Menu is position:fixed so an overflow:hidden ancestor cannot clip it. */
function PartCombo({ pool, placeholder, onPick, onCustom, hint }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const boxRef = useRef(null);

  const hits = useMemo(() => {
    const s = q.trim().toLowerCase();
    if (!s || !pool || !pool.length) return [];
    const word = new RegExp("\\b" + s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
    const out = [];
    for (const p of pool) {
      const i = p.name.toLowerCase().indexOf(s);
      if (i === 0) out.push([0, p]);
      else if (i > 0) out.push([1, p]);
      else if (word.test(p.desc || "")) out.push([2, p]);
    }
    out.sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length || a[1].name.localeCompare(b[1].name));
    return out.slice(0, 10).map(x => x[1]);
  }, [q, pool]);

  useLayoutEffect(() => {
    if (!open || !hits.length) { setPos(null); return; }
    const place = () => {
      const el = boxRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const gap = 4, edge = 12;
      const below = window.innerHeight - r.bottom - edge;
      const above = r.top - edge;
      const up = below < 180 && above > below;
      setPos({
        left: r.left, width: r.width, up,
        offset: up ? window.innerHeight - r.top + gap : r.bottom + gap,
        maxHeight: Math.max(120, Math.min(400, (up ? above : below) - gap)),
      });
    };
    place();
    window.addEventListener("scroll", place, true);
    window.addEventListener("resize", place);
    return () => {
      window.removeEventListener("scroll", place, true);
      window.removeEventListener("resize", place);
    };
  }, [open, hits.length, q]);

  const choose = rec => { onPick(rec); setQ(""); setSel(0); setOpen(false); };
  const key = e => {
    if (e.key === "ArrowDown") { e.preventDefault(); setSel(s => Math.min(s + 1, hits.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel(s => Math.max(s - 1, 0)); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (hits[sel]) choose(hits[sel]);
      else if (onCustom && q.trim()) { onCustom(q.trim()); setQ(""); setOpen(false); }
    } else if (e.key === "Escape") setOpen(false);
  };

  return (
    <div style={{flex:1,minWidth:0}}>
      <div ref={boxRef} style={{display:"flex",gap:8,padding:"7px 10px",background:"#0f172a",border:"1px solid #334155",borderRadius:6}}>
        <input
          value={q}
          onChange={e=>{setQ(e.target.value);setSel(0);setOpen(true);}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setOpen(false)}
          onKeyDown={key}
          placeholder={placeholder}
          style={{flex:1,minWidth:0,background:"none",border:"none",outline:"none",color:"#e2e8f0",fontSize:12}}
        />
        {q.trim() && (
          <span style={{fontSize:10,color:"#475569",alignSelf:"center",whiteSpace:"nowrap"}}>
            {hits.length ? `${hits.length===10?"top 10":hits.length} · ↵` : (hint || "no match")}
          </span>
        )}
      </div>
      {open && hits.length > 0 && pos && (
        <div style={{position:"fixed",left:pos.left,width:pos.width,[pos.up?"bottom":"top"]:pos.offset,
          maxHeight:pos.maxHeight,overflowY:"auto",background:"#0f172a",border:"1px solid #334155",
          borderRadius:7,zIndex:1000,boxShadow:"0 10px 30px rgba(0,0,0,.55)"}}>
          {hits.map((s,i)=>(
            <div key={s.id}
              onMouseDown={e=>{e.preventDefault();choose(s);}}
              onMouseEnter={()=>setSel(i)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",cursor:"pointer",
                background:i===sel?"#1e293b":"transparent",
                borderLeft:`3px solid ${i===sel?(FILL[s.type]||"#64748b"):"transparent"}`}}>
              <span style={{flex:1,minWidth:0}}>
                <span style={{display:"block",fontSize:12,color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</span>
                {s.desc && <span style={{display:"block",fontSize:10,color:"#475569",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.desc}</span>}
              </span>
              <span style={{fontSize:10,color:"#475569",whiteSpace:"nowrap"}}>{s.length ? s.length.toLocaleString()+" bp" : "\u2014"}</span>
              <span style={{fontSize:10,padding:"2px 7px",background:`${FILL[s.type]||"#64748b"}1a`,color:FILL[s.type]||"#64748b",borderRadius:20,border:`1px solid ${FILL[s.type]||"#64748b"}33`,whiteSpace:"nowrap"}}>{s.type}</span>
              <EvidencePill evidence={s.evidence}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

let _uid = 0;

/* ── SVG plasmid map ─────────────────────────────────────────────────── */
function PlasmidSVG({ parts, total, host, gc }) {
  if (!parts?.length || !total) return null;
  const W=320,cx=160,cy=160,R=115,r=73;
  const pt = (radius, deg) => {
    const rad = (deg-90)*Math.PI/180;
    return [cx+radius*Math.cos(rad), cy+radius*Math.sin(rad)];
  };
  let a=0;
  const segs = parts.map(p => { const sw=(p.len/total)*360; const o={...p,s:a,e:a+sw,sw}; a+=sw; return o; });
  return (
    <svg viewBox={`0 0 ${W} ${W}`} style={{width:260,flexShrink:0}}>
      {segs.map((sg,i) => {
        const [x1,y1]=pt(R,sg.s),[x2,y2]=pt(R,sg.e);
        const [xi1,yi1]=pt(r,sg.s),[xi2,yi2]=pt(r,sg.e);
        const lg=sg.sw>180?1:0;
        const d=`M${x1} ${y1} A${R} ${R} 0 ${lg} 1 ${x2} ${y2} L${xi2} ${yi2} A${r} ${r} 0 ${lg} 0 ${xi1} ${yi1}Z`;
        const [lx,ly]=pt(R+22,sg.s+sg.sw/2);
        return (
          <g key={i}>
            <path d={d} fill={FILL[sg.type]||"#64748b"} stroke="#0f172a" strokeWidth="1.5" opacity="0.92"/>
            {sg.sw>13 && <text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="7.5" fill="#e2e8f0" fontFamily="system-ui">{sg.name.length>13?sg.name.slice(0,11)+"…":sg.name}</text>}
          </g>
        );
      })}
      <circle cx={cx} cy={cy} r={r-1} fill="#0f172a"/>
      <text x={cx} y={cy-12} textAnchor="middle" fontSize="15" fontWeight="700" fill="#f1f5f9" fontFamily="system-ui">{(total/1000).toFixed(2)} kb</text>
      <text x={cx} y={cy+6}  textAnchor="middle" fontSize="9"  fill="#64748b" fontStyle="italic" fontFamily="system-ui">{host}</text>
      <text x={cx} y={cy+20} textAnchor="middle" fontSize="8"  fill="#475569" fontFamily="system-ui">GC: {gc.toFixed(1)}%</text>
    </svg>
  );
}

function buildCmap(seq, parts) {
  const m = new Array(seq.length).fill("#475569");
  let pos=0;
  parts.forEach(p => { for(let i=pos;i<Math.min(pos+p.len,seq.length);i++) m[i]=FILL[p.type]||"#64748b"; pos+=p.len; });
  return m;
}
function cRuns(str, start, m) {
  const r=[]; let col=null,s="";
  [...str].forEach((c,j)=>{ const nc=m[start+j]||"#475569"; if(nc!==col){if(s)r.push({s,col});col=nc;s=c;}else s+=c; });
  if(s)r.push({s,col}); return r;
}

/* ── Main App ────────────────────────────────────────────────────────── */
function App() {
  const [host, setHost] = useState("");
  const [parts, setParts] = useState([]);       // {id, name, type, seq, len}
  const [result, setResult] = useState(null);
  const [tab, setTab] = useState("map");
  const [addFilter, setAddFilter] = useState("");   // "" = all types
  const [copied, setCopied] = useState(false);
  const [expanded, setExpanded] = useState(null); // part id for seq editing
  const [db, setDb] = useState(null);            // parts array from ./data/parts.json
  const [dbErr, setDbErr] = useState(null);
  const [templates, setTemplates] = useState(null);
  const [tplId, setTplId] = useState("");
  const [cdsPart, setCdsPart] = useState(null);     // chosen gene of interest
  const [asmErr, setAsmErr] = useState(null);   // names of parts with no sequence

  useEffect(() => {
    let cancelled = false;
    const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(u + " - HTTP " + r.status); return r.json(); });
    Promise.all([get("./data/parts.json"), get("./data/templates.json")])
      .then(([p, t]) => {
        if (cancelled) return;
        setDb(p.parts || []);
        setTemplates(t.templates || []);
        setTplId(prev => prev || (t.templates && t.templates[0] ? t.templates[0].id : ""));
      })
      .catch(e => { if (!cancelled) setDbErr(e.message); });
    return () => { cancelled = true; };
  }, []);

  // name -> part. 293 names repeat in the SnapGene bundle; first occurrence wins.
  const byName = useMemo(() => {
    const m = new Map();
    if (db) for (const p of db) if (!m.has(p.name)) m.set(p.name, p);
    return m;
  }, [db]);
  const byId = useMemo(() => {
    const m = new Map();
    if (db) for (const p of db) m.set(p.id, p);
    return m;
  }, [db]);

  // the exact record a design part came from; falls back to name for custom parts
  const meta = p => (p.srcId && byId.get(p.srcId)) || byName.get(p.name) || null;

  // design() indexes with partsById[id], so it needs a plain object, not the Map
  const partsById = useMemo(() => {
    const o = {};
    if (db) for (const p of db) o[p.id] = p;
    return o;
  }, [db]);

  const template = useMemo(
    () => (templates || []).find(t => t.id === tplId) || null,
    [templates, tplId]
  );

  const cdsPool = useMemo(() => (db || []).filter(p => p.type === "cds"), [db]);
  const addPool = useMemo(
    () => (!db ? [] : addFilter ? db.filter(p => p.type === addFilter) : db),
    [db, addFilter]
  );
  const cdsMatch = cdsPart;

  // { plan } on success, { err } on failure - no setState during render
  const designed = useMemo(() => {
    if (!template || !window.Designer) return {};
    try { return { plan: window.Designer.design(template, partsById, cdsMatch) }; }
    catch (e) { return { err: e.message }; }
  }, [template, partsById, cdsMatch]);
  const plan = designed.plan || null;
  const designErr = designed.err || null;

  useEffect(() => {
    if (!plan || !template) return;
    setHost(template.host);
    setParts(prev => {
      const seeded = plan.order.map(o => {
        const rec = partsById[o.id];
        const seq = rec ? rec.seq : null;
        return {
          id: ++_uid, srcId: o.id, name: o.name,
          type: (rec && rec.type) || ROLE_TYPE[o.role] || o.role,
          role: o.role, seq, len: seq ? seq.length : 0,
        };
      });
      return [...seeded, ...prev.filter(p => p.extra)];   // hand-added parts survive
    });
    setResult(null); setExpanded(null); setAsmErr(null);
  }, [plan, template, partsById]);

  const addRecord = rec => {
    const seq = seqFor(rec, host);
    setParts(p => [...p, {id:++_uid, srcId:rec.id, name:rec.name, type:rec.type, seq, len: seq ? seq.length : 0, extra:true}]);
    setResult(null); setAsmErr(null);
  };

  // free text with no match: keep it as a custom part to paste a sequence into
  const addCustom = name => {
    setParts(p => [...p, {id:++_uid, srcId:null, name, type:guessType(name), seq:null, len:0, extra:true}]);
    setResult(null); setAsmErr(null);
  };

  const updateSeq = (id, newSeq) => {
    const s = newSeq.toUpperCase().replace(/[^ATCG]/g,"");
    setParts(p => p.map(x => x.id===id ? {...x, seq:s, len:s.length} : x));
    setResult(null); setAsmErr(null);
  };

  const delPart = id => { setParts(p => p.filter(x => x.id!==id)); setResult(null); setAsmErr(null); };
  const movePart = (id,d) => setParts(prev => {
    const i=prev.findIndex(x=>x.id===id);
    if(i+d<0||i+d>=prev.length) return prev;
    const a=[...prev]; [a[i],a[i+d]]=[a[i+d],a[i]]; setResult(null); setAsmErr(null); return a;
  });

  const assemble = () => {
    const blockers = [];
    if (plan) {
      for (const g of plan.gaps) {
        blockers.push(g.role + " — " + g.reason + (g.missing ? " (" + g.missing.join(", ") + ")" : ""));
      }
    }
    for (const p of parts) if (!p.seq) blockers.push(p.name + " — no verified sequence on file");
    if (blockers.length) {
      setAsmErr(blockers);
      setResult(null);
      return;
    }
    setAsmErr(null);
    const assembled = parts.map(p=>p.seq).join("");
    const gc = gcCalc(assembled);
    const proto = protocolFor(host);
    setResult({ assembled, gc, total: assembled.length, proto });
    setTab("map");
  };

  const copyFASTA = () => {
    if (!result) return;
    navigator.clipboard.writeText(`>plasmid|${host.replace(". ","_")}|Lysqdvp001|${result.total}bp|GC${result.gc.toFixed(1)}%\n${result.assembled}`);
    setCopied(true); setTimeout(()=>setCopied(false),2000);
  };

  const stepN = !host?1:!result?2:3;
  const S = {
    card:{background:"#1e293b",border:"1px solid #334155",borderRadius:12,overflow:"hidden",marginBottom:16},
    label:{fontSize:11,color:"#475569",marginBottom:10,textTransform:"uppercase",letterSpacing:1.2,display:"block"},
    tabBtn:a=>({flex:1,padding:"10px 4px",background:"none",border:"none",borderBottom:`2px solid ${a?"#0ea5e9":"transparent"}`,color:a?"#38bdf8":"#475569",cursor:"pointer",fontSize:11,fontWeight:a?600:400}),
    ib:{background:"none",border:"none",color:"#475569",cursor:"pointer",padding:"2px 5px",fontSize:12},
  };

  if (dbErr || !db || !templates) return (
    <div style={{minHeight:"100vh",background:"#0f172a",color:"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:26,marginBottom:10}}>🧬</div>
        {dbErr
          ? <div style={{color:"#f87171"}}>Could not load ./data/parts.json — {dbErr}</div>
          : <div style={{color:"#64748b"}}>Loading parts…</div>}
      </div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#0f172a",color:"#e2e8f0"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(90deg,#0c4a6e,#0369a1)",padding:"13px 20px",display:"flex",alignItems:"center",gap:12,borderBottom:"2px solid #0284c7"}}>
        <span style={{fontSize:22}}>🧬</span>
        <div>
          <div style={{fontWeight:800,fontSize:15}}>Del Norte iGEM · Plasmid Builder</div>
          <div style={{fontSize:11,color:"#7dd3fc"}}>Sequence assembly for coral reef protection · no login required</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:4,alignItems:"center"}}>
          {["Host","Parts","Output"].map((l,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:3}}>
              <div style={{width:24,height:24,borderRadius:"50%",background:stepN>i+1?"#0ea5e9":stepN===i+1?"#1e40af":"#1e293b",border:`2px solid ${stepN>i+1?"#38bdf8":stepN===i+1?"#3b82f6":"#334155"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:stepN>i+1?"#fff":stepN===i+1?"#93c5fd":"#475569"}}>{i+1}</div>
              <span style={{fontSize:10,color:stepN===i+1?"#93c5fd":"#334155"}}>{l}</span>
              {i<2&&<span style={{color:"#1e3a5f",margin:"0 3px"}}>›</span>}
            </div>
          ))}
        </div>
      </div>

      <div style={{padding:"20px",maxWidth:860,margin:"0 auto"}}>

        {/* 01 - template, gene, and the editable part list */}
        <div style={{marginBottom:16}}>
          <span style={S.label}>01 — Design</span>
          <div style={S.card}>

            {/* template + gene of interest */}
            <div style={{display:"flex",gap:10,padding:"12px 14px",flexWrap:"wrap",borderBottom:"1px solid #1e293b"}}>
              <div style={{flex:"1 1 240px",minWidth:0}}>
                <div style={{fontSize:10,color:"#475569",marginBottom:5}}>HOST / TEMPLATE</div>
                <select value={tplId} onChange={e=>setTplId(e.target.value)}
                  style={{width:"100%",background:"#0f172a",border:"1px solid #334155",borderRadius:6,color:"#e2e8f0",fontSize:12,padding:"8px",outline:"none"}}>
                  {templates.map(t => <option key={t.id} value={t.id}>{t.host} — {t.label}</option>)}
                </select>
              </div>
              <div style={{flex:"1 1 240px",minWidth:0}}>
                <div style={{fontSize:10,color:"#475569",marginBottom:5}}>GENE OF INTEREST · {cdsPool.length.toLocaleString()} CDS</div>
                {cdsPart ? (
                  <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"#0f172a",border:"1px solid #1e3a5f",borderRadius:6}}>
                    <span style={{flex:1,minWidth:0,fontSize:12,color:"#93c5fd",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cdsPart.name}</span>
                    <span style={{fontSize:10,color:"#475569",whiteSpace:"nowrap"}}>{cdsPart.seq ? cdsPart.length.toLocaleString()+" bp" : "no seq"}</span>
                    <EvidencePill evidence={cdsPart.evidence}/>
                    <button onClick={()=>setCdsPart(null)} style={{...S.ib,fontSize:15}} title="Clear">×</button>
                  </div>
                ) : (
                  <div style={{display:"flex"}}>
                    <PartCombo pool={cdsPool} placeholder="Search CDS parts… e.g. GFP, lacZ, Lysqdvp001"
                      onPick={rec=>setCdsPart(rec)} hint="no CDS match"/>
                  </div>
                )}
              </div>
            </div>

            {designErr && (
              <div style={{margin:"12px 14px",background:"#2a0a0a",border:"1px solid #b91c1c",borderRadius:8,padding:"10px 12px",color:"#fca5a5",fontSize:12}}>
                designer.js threw: {designErr}
              </div>
            )}
            {!window.Designer && (
              <div style={{margin:"12px 14px",background:"#2a0a0a",border:"1px solid #b91c1c",borderRadius:8,padding:"10px 12px",color:"#fca5a5",fontSize:12}}>
                ./designer.js did not load — the page must be served over http, not opened as a file.
              </div>
            )}

            {plan && (
              <div style={{display:"flex",background:"#0f172a",borderBottom:"1px solid #1e293b"}}>
                {[{v:plan.buildable?"Buildable":"Not buildable",l:"Status",c:plan.buildable?"#4ade80":"#f87171"},
                  {v:`${(plan.totalLength/1000).toFixed(2)} kb`,l:"Length",c:"#38bdf8"},
                  {v:`${plan.gc}%`,l:"GC",c:"#38bdf8"},
                  {v:parts.length,l:"Parts",c:"#38bdf8"}].map((s,i)=>(
                  <div key={i} style={{flex:1,padding:"10px 6px",textAlign:"center",borderRight:i<3?"1px solid #1e293b":"none"}}>
                    <div style={{fontSize:14,fontWeight:800,color:s.c}}>{s.v}</div>
                    <div style={{fontSize:10,color:"#475569"}}>{s.l}</div>
                  </div>
                ))}
              </div>
            )}

            {/* type legend */}
            <div style={{padding:"8px 14px",background:"#0f172a",borderBottom:"1px solid #1e293b",display:"flex",gap:10,flexWrap:"wrap"}}>
              {TYPES.map(t=><div key={t} style={{display:"flex",alignItems:"center",gap:5,fontSize:11}}><div style={{width:8,height:8,borderRadius:2,background:FILL[t]}}/><span style={{color:"#64748b"}}>{t}</span></div>)}
            </div>

            {/* the design, editable in place */}
            <div style={{padding:"12px 14px"}}>
              <div style={{fontSize:10,color:"#475569",marginBottom:8,letterSpacing:.5}}>
                PART ORDER · 5' → 3' · use ▲▼ to reorder, ✎ to edit a sequence
              </div>
              {parts.length === 0 && (
                <div style={{fontSize:12,color:"#475569",padding:"10px 0"}}>No parts yet — pick a template above.</div>
              )}
                {parts.map((p,i)=>(
                  <div key={p.id} style={{marginBottom:5}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"#0f172a",border:`1px solid ${FILL[p.type]||"#334155"}22`,borderLeft:`3px solid ${FILL[p.type]||"#334155"}`,borderRadius:expanded===p.id?"7px 7px 0 0":7}}>
                      <span style={{color:"#334155",fontSize:11,minWidth:16}}>{i+1}</span>
                      <span style={{flex:1,fontSize:13}}>{p.name}{!p.seq && <span style={{color:"#fbbf24",marginLeft:6,fontSize:11}} title="No verified sequence on file">⚠️</span>}</span>
                      <span style={{fontSize:10,color:"#64748b"}}>{p.len.toLocaleString()} bp</span>
                      <span style={{fontSize:10,padding:"2px 7px",background:`${FILL[p.type]||"#64748b"}1a`,color:FILL[p.type]||"#64748b",borderRadius:20,border:`1px solid ${FILL[p.type]||"#64748b"}33`}}>{p.type}</span>
                      <EvidencePill evidence={meta(p)?.evidence}/>
                      <button onClick={()=>setExpanded(expanded===p.id?null:p.id)} style={{...S.ib,color:expanded===p.id?"#38bdf8":"#475569",fontSize:11}} title="Edit sequence">✎</button>
                      <button onClick={()=>movePart(p.id,-1)} style={S.ib}>▲</button>
                      <button onClick={()=>movePart(p.id,1)} style={S.ib}>▼</button>
                      <button onClick={()=>delPart(p.id)} style={{...S.ib,fontSize:16}}>×</button>
                    </div>
                    {expanded===p.id && (
                      <div style={{background:"#070f1a",border:`1px solid ${FILL[p.type]||"#334155"}44`,borderTop:"none",borderRadius:"0 0 7px 7px",padding:10}}>
                        <div style={{fontSize:10,color:"#475569",marginBottom:6}}>{meta(p)?.src || "Custom sequence"}</div>
                        <textarea
                          value={p.seq || ""}
                          onChange={e=>updateSeq(p.id,e.target.value)}
                          rows={4}
                          placeholder="Paste or edit sequence here (ATCG only)"
                          style={{width:"100%",background:"#0f172a",border:"1px solid #334155",borderRadius:5,color:"#60a5fa",fontSize:10,fontFamily:"monospace",padding:"8px",resize:"vertical",outline:"none"}}
                        />
                        {meta(p)?.evidence === "placeholder" && (
                          <div style={{fontSize:10,color:"#fbbf24",marginTop:4}}>⚠️ No verified sequence on file — paste your lab sequence above before ordering synthesis.</div>
                        )}
                      </div>
                    )}
                  </div>
                ))}


              {/* add more parts, optionally filtered by type */}
              <div style={{display:"flex",gap:8,marginTop:10,alignItems:"stretch",flexWrap:"wrap"}}>
                <select value={addFilter} onChange={e=>setAddFilter(e.target.value)}
                  style={{background:"#0f172a",border:"1px solid #334155",borderRadius:6,color:addFilter?FILL[addFilter]:"#94a3b8",fontSize:11,padding:"0 8px",outline:"none",flexShrink:0}}>
                  <option value="">all types</option>
                  {TYPES.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
                <PartCombo
                  pool={addPool}
                  placeholder={addFilter ? `Add another ${addFilter}… (${addPool.length.toLocaleString()} parts)` : `Add another part… (${addPool.length.toLocaleString()} parts)`}
                  onPick={addRecord}
                  onCustom={addCustom}
                  hint="↵ adds as custom"
                />
              </div>
            </div>

            {plan && (
              <div style={{padding:"0 14px"}}>
                {plan.gaps.length > 0 && (
                  <Section title={`Gaps (${plan.gaps.length})`} tone="#f87171">
                    {plan.gaps.map((g,i)=>(
                      <div key={i} style={{fontSize:12,color:"#fca5a5",padding:"5px 8px",background:"#2a0a0a",border:"1px solid #7f1d1d",borderRadius:5,marginBottom:4}}>
                        <b>{g.role}</b> — {g.reason}
                        {g.missing && <span style={{color:"#7f1d1d",display:"block",fontSize:10,marginTop:2,fontFamily:"monospace"}}>wanted: {g.missing.join(", ")}</span>}
                      </div>
                    ))}
                  </Section>
                )}

                {plan.placeholders.length > 0 && (
                  <Section title={`Placeholders (${plan.placeholders.length})`} tone="#fbbf24">
                    <div style={{fontSize:12,color:"#fbbf24",padding:"5px 8px",background:"#1c1500",border:"1px solid #78350f",borderRadius:5}}>
                      {plan.placeholders.join(", ")}
                      <span style={{display:"block",fontSize:10,color:"#a16207",marginTop:3}}>No verified sequence on file — primers cannot be designed until these are supplied.</span>
                    </div>
                  </Section>
                )}

                {plan.siteConflicts.length > 0 && (
                  <Section title={`Site conflicts (${plan.siteConflicts.length})`} tone="#fbbf24">
                    {plan.siteConflicts.map((c,i)=>(
                      <div key={i} style={{fontSize:12,color:"#fbbf24",padding:"4px 8px",background:"#1c1500",border:"1px solid #78350f",borderRadius:5,marginBottom:4}}>
                        <b>{c.enzyme}</b> site inside <b>{c.part}</b> at position {c.position.toLocaleString()}
                      </div>
                    ))}
                  </Section>
                )}

                {plan.primers.length > 0 && (
                  <Section title={`Gibson primers (${plan.primers.length*2})`}>
                    {plan.primers.map((pr,i)=>(
                      <div key={i} style={{marginBottom:8,background:"#070f1a",border:"1px solid #1e293b",borderRadius:6,padding:"8px 10px"}}>
                        <div style={{fontSize:11,color:"#93c5fd",marginBottom:4}}>{pr.part} <span style={{color:"#475569"}}>· {pr.role}</span></div>
                        {[["F",pr.fwd,pr.fwd_tm],["R",pr.rev,pr.rev_tm]].map(([d,s,t])=>(
                          <div key={d} style={{display:"flex",gap:8,alignItems:"baseline",marginTop:2}}>
                            <span style={{fontSize:10,color:"#475569",minWidth:12}}>{d}</span>
                            <span style={{flex:1,fontFamily:"monospace",fontSize:10,color:"#60a5fa",wordBreak:"break-all"}}>{s}</span>
                            <span style={{fontSize:10,color:"#64748b",whiteSpace:"nowrap"}}>Tm {t}°C</span>
                          </div>
                        ))}
                      </div>
                    ))}
                  </Section>
                )}
              </div>
            )}

            {/* assemble */}
            <div style={{padding:"0 14px 14px"}}>
              {asmErr && (
                <div style={{background:"#2a0a0a",border:"1px solid #b91c1c",borderRadius:9,padding:"12px 14px",marginBottom:10}}>
                  <div style={{color:"#f87171",fontSize:13,fontWeight:700,marginBottom:6}}>
                    ✕ Cannot assemble — {asmErr.length} unresolved issue{asmErr.length>1?"s":""}
                  </div>
                  <ul style={{margin:"0 0 8px 18px",padding:0}}>
                    {asmErr.map(msg => <li key={msg} style={{color:"#fca5a5",fontSize:12,lineHeight:1.6}}>{msg}</li>)}
                  </ul>
                  <div style={{color:"#fbbf24",fontSize:11}}>
                    Supply the missing parts in ./data/parts.json, or click ✎ above to paste a verified sequence.
                  </div>
                </div>
              )}
              <button onClick={assemble} disabled={!parts.length} style={{width:"100%",padding:"13px",background:"linear-gradient(90deg,#0369a1,#0ea5e9)",border:"none",borderRadius:9,color:"#fff",fontSize:14,fontWeight:700,cursor:!parts.length?"not-allowed":"pointer",opacity:!parts.length?.5:1}}>
                ⚗️ Assemble Plasmid
              </button>
            </div>
          </div>
        </div>

        {/* Step 3 */}
        {result && (
          <div>
            <span style={S.label}>03 — Assembly output</span>
            <div style={S.card}>
              <div style={{display:"flex",background:"#0f172a",borderBottom:"1px solid #1e293b"}}>
                {[{v:`${(result.total/1000).toFixed(2)} kb`,l:"Plasmid size"},{v:`${result.gc.toFixed(1)}%`,l:"GC content"},{v:parts.length,l:"Parts"},{v:host.split(" ")[1]||host,l:"Host"}].map((s,i)=>(
                  <div key={i} style={{flex:1,padding:"12px 6px",textAlign:"center",borderRight:i<3?"1px solid #1e293b":"none"}}>
                    <div style={{fontSize:16,fontWeight:800,color:"#38bdf8"}}>{s.v}</div>
                    <div style={{fontSize:10,color:"#475569"}}>{s.l}</div>
                  </div>
                ))}
              </div>
              <div style={{display:"flex",background:"#0f172a",borderBottom:"1px solid #1e293b"}}>
                {[["map","🗺 Map"],["parts","🧩 Parts"],["sequence","🔤 Sequence"],["delivery","📋 Delivery"]].map(([id,label])=>(
                  <button key={id} onClick={()=>setTab(id)} style={S.tabBtn(tab===id)}>{label}</button>
                ))}
              </div>

              <div style={{padding:"18px 16px"}}>

                {tab==="map" && (
                  <div style={{display:"flex",gap:20,alignItems:"flex-start",flexWrap:"wrap"}}>
                    <PlasmidSVG parts={parts.map(p=>({...p,len:p.len}))} total={result.total} host={host} gc={result.gc}/>
                    <div style={{flex:1,minWidth:160}}>
                      <div style={{fontSize:11,color:"#64748b",marginBottom:10}}>SUMMARY</div>
                      {[
                        `${(result.total/1000).toFixed(2)} kb assembled from ${parts.length} parts`,
                        `GC content: ${result.gc.toFixed(1)}%`,
                        `Host: ${host}${template ? " — " + template.label : ""}`,
                        `Assembly: ${template ? template.assembly : "manual"}`,
                        cdsMatch
                          ? `Gene of interest: ${cdsMatch.name}${cdsMatch.desc ? " — " + cdsMatch.desc : ""}`
                          : `Gene of interest: none selected`,
                        `Selection: ${result.proto ? result.proto.selection : "no protocol on file for " + host}`,
                      ].map((f,i)=>(
                        <div key={i} style={{display:"flex",gap:8,marginBottom:8}}>
                          <span style={{color:"#0ea5e9",flexShrink:0}}>◆</span>
                          <span style={{fontSize:12,color:"#cbd5e1",lineHeight:1.5}}>{f}</span>
                        </div>
                      ))}
                      <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid #1e293b"}}>
                        <div style={{fontSize:10,color:"#475569",marginBottom:6}}>LEGEND</div>
                        {TYPES.filter(t=>parts.some(p=>p.type===t)).map(t=>(
                          <div key={t} style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                            <div style={{width:10,height:10,borderRadius:2,background:FILL[t]}}/>
                            <span style={{fontSize:11,color:"#64748b"}}>{t}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {tab==="parts" && (
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {parts.map((p,i)=>(
                      <div key={i} style={{border:`1px solid ${FILL[p.type]||"#334155"}33`,borderLeft:`3px solid ${FILL[p.type]||"#334155"}`,background:`${FILL[p.type]||"#64748b"}0a`,borderRadius:8,padding:"12px 14px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                          <span style={{fontWeight:600,color:FILL[p.type]||"#94a3b8",fontSize:13}}>{p.name}</span>
                          <span style={{fontSize:11,color:"#475569"}}>{p.len.toLocaleString()} bp</span>
                        </div>
                        <div style={{fontSize:12,color:"#94a3b8",marginBottom:3}}>{meta(p)?.desc||"Custom part"}</div>
                        <div style={{fontSize:11,color:"#475569"}}>📚 {meta(p)?.src||"User-provided"}</div>
                        <div style={{marginTop:8,fontFamily:"monospace",fontSize:10,color:"#334155",background:"#070f1a",borderRadius:4,padding:"6px 8px",wordBreak:"break-all"}}>
                          {p.seq ? p.seq.slice(0,100)+"…" : "no sequence on file"}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {tab==="sequence" && (()=>{
                  const seq=result.assembled;
                  const cmap=buildCmap(seq,parts);
                  const W=60; const lines=[];
                  for(let i=0;i<seq.length;i+=W) lines.push({n:i+1,s:seq.slice(i,i+W)});
                  return (
                    <div>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                        <span style={{fontSize:12,color:"#64748b"}}>{seq.length.toLocaleString()} nt · color-coded by part</span>
                        <button onClick={copyFASTA} style={{background:"#0369a1",border:"none",borderRadius:6,color:"#fff",fontSize:12,padding:"6px 14px",cursor:"pointer"}}>{copied?"✓ Copied!":"Copy FASTA"}</button>
                      </div>
                      <div style={{fontSize:11,color:"#fbbf24",marginBottom:8,padding:"6px 10px",background:"#1c1500",borderRadius:6,border:"1px solid #78350f"}}>
                        ⚠️ Parts marked ⚠️ have no verified sequence in ./data/parts.json and contribute 0 bp — click ✎ on each to paste your verified sequence before ordering synthesis.
                      </div>
                      <div style={{maxHeight:320,overflowY:"auto",background:"#070f1a",borderRadius:8,padding:"10px 12px",fontFamily:"monospace"}}>
                        {lines.map(({n,s})=>(
                          <div key={n} style={{display:"flex",gap:8,marginBottom:1}}>
                            <span style={{color:"#1e3a5f",fontSize:10,minWidth:46,textAlign:"right",flexShrink:0}}>{n}</span>
                            <span style={{fontSize:10,lineHeight:1.7}}>
                              {cRuns(s,n-1,cmap).map((r,i)=><span key={i} style={{color:r.col}}>{r.s}</span>)}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}

                {tab==="delivery" && !result.proto && (
                  <div style={{background:"#1c1500",border:"1px solid #78350f",borderRadius:10,padding:"14px 16px",color:"#fbbf24",fontSize:13}}>
                    No transformation protocol on file for <i>{host}</i>.
                    <div style={{fontSize:11,color:"#a16207",marginTop:5}}>
                      Protocols are defined per host in PROTOCOLS; add one for this template's host to populate this tab.
                    </div>
                  </div>
                )}

                {tab==="delivery" && result.proto && (
                  <div>
                    <div style={{background:"#0c4a6e",border:"1px solid #0369a1",borderRadius:10,padding:"12px 16px",marginBottom:16}}>
                      <div style={{fontWeight:700,color:"#38bdf8",fontSize:14}}>{result.proto.method}</div>
                      <div style={{fontSize:12,color:"#7dd3fc",fontStyle:"italic",marginTop:2}}>{host}</div>
                    </div>
                    <div style={{fontSize:10,color:"#475569",marginBottom:10,letterSpacing:.5}}>PROTOCOL</div>
                    {result.proto.steps.map((s,i)=>(
                      <div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
                        <div style={{minWidth:24,height:24,borderRadius:"50%",background:"#1e3a5f",border:"2px solid #0369a1",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#38bdf8",flexShrink:0}}>{i+1}</div>
                        <span style={{fontSize:13,color:"#cbd5e1",paddingTop:2,lineHeight:1.5}}>{s}</span>
                      </div>
                    ))}
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:4}}>
                      <div style={{background:"#0f172a",border:"1px solid #166534",borderRadius:8,padding:12}}>
                        <div style={{fontSize:10,color:"#4ade80",marginBottom:4}}>SELECTION</div>
                        <div style={{fontSize:12,color:"#cbd5e1"}}>{result.proto.selection}</div>
                      </div>
                      <div style={{background:"#0f172a",border:"1px solid #1e3a5f",borderRadius:8,padding:12}}>
                        <div style={{fontSize:10,color:"#60a5fa",marginBottom:4}}>VERIFICATION</div>
                        <div style={{fontSize:12,color:"#cbd5e1"}}>{result.proto.verification}</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <div style={{padding:"0 16px 14px"}}>
                <button onClick={()=>{setResult(null);setAsmErr(null);setTab("map");}} style={{width:"100%",padding:"8px",background:"none",border:"1px solid #334155",borderRadius:7,color:"#475569",cursor:"pointer",fontSize:12,marginTop:4}}>
                  ↩ New design
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
