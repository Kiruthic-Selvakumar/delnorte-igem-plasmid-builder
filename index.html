      try { setSelfRes(C.selfTest(organisms)); } catch (e) { setSelfRes({error:e.message}); }
    }, 0);
    return () => clearTimeout(t);
  }, [C, organisms, selfRes, setSelfRes]);

  return (
    <>
      <Headed title="Verification">
        Where every number in this tool comes from, and a suite that re-runs in your browser. If a check fails
        here, do not trust the output above it.
      </Headed>

      <table className="data">
        <thead><tr><th>Organism</th><th>Genome-average table</th><th>Status</th><th>CAI reference set</th><th>Genome GC</th><th>Host</th></tr></thead>
        <tbody>
          {Object.values(organisms).map(o=>{
            const built = !!usageOv[o.id];
            const bd = built ? {cls:"ok", text:"your table"}
              : o.table.status === "provisional" ? {cls:"prov", text:"provisional"}
              : o.table.status === "none" ? {cls:"none", text:"no table"}
              : {cls:"ok", text:"verified"};
            const hi = highOv[o.id] ? {status:"measured", label:"your highly-expressed set"}
              : (o.usageHigh ? o.highSource : {status:"heuristic", label:"sharpened genome average"});
            return (
              <tr key={o.id}>
                <td className="lead">{o.name}<br/><span style={{color:"var(--dim)",fontSize:10.5}}>{o.strain}</span></td>
                <td>{built ? "Built from your CDS or pasted table" : (o.table.source || "none on file")}</td>
                <td><span className={"badge "+bd.cls}>{bd.text}</span></td>
                <td>{hi.label}<br/><span className={"badge "+(hi.status === "heuristic" ? "prov" : "ok")}>{hi.status}</span></td>
                <td>{pctS(o.gcGenome)}</td>
                <td>{o.hostClass === "yeast" ? "eukaryote" : "bacteria"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>

      <div className="note">
        <strong>What “verified” means here.</strong> The three Kazusa tables were checked three ways: every
        family contains all its synonymous codons, every family sums to 1.000, and the amino-acid assignment
        was compared codon by codon against this tool's genetic code with zero mismatches. They were also
        spot-checked against textbook facts — the rare E. coli arginine codons AGA and AGG at 0.04 and 0.02,
        yeast preferring AGA for arginine and TTG for leucine, B. subtilis using AAA for 70% of lysines. It
        does not mean the table matches your strain in your medium. Codon usage is strain- and
        condition-dependent, and the honest move is to build one from your own genome.
      </div>
      <div className="note">
        <strong>Genome average is not the same as the CAI reference set.</strong> CAI was defined against
        highly expressed genes, and for E. coli the two tables disagree on which codon is best in 10 of 18
        synonymous families — highly expressed genes prefer GCT, GGT and CGT where the genome average prefers
        GCG, GGC and CGC, because mutational pressure pushes the genome toward GC while tRNA abundance pulls
        expressed genes the other way. They agree closely on which codons are rare, which is why the two
        sources correlate at Spearman 0.67 overall while disagreeing at the top. E. coli ships with the
        measured Sharp and Li 1987 reference. The others fall back to a sharpened genome average, which is
        flagged as heuristic everywhere it is used — build a real one from ribosomal-protein CDS to replace it.
      </div>
      <div className="note">
        <strong>Why V. natriegens has no table.</strong> It is a plasmid host in this project, but no
        genome-derived codon table was reachable from the environment this tool was built in, and inventing
        one would have been worse than admitting the gap — the same reason the V. natrigens variant of the
        Lysqdvp001 endolysin is still null in parts.json. Optimizing against E. coli is the conventional
        stand-in for a Gammaproteobacterium, but the accurate route is to paste V. natriegens CDS in the Codon
        tables panel and count a real table. Halomonas is a different kind of gap: its entry is an explicit
        mutational-equilibrium null model built from genome GC alone, which cannot tell a preferred codon from
        a merely GC-rich one, so maximizing CAI against it just maximizes GC.
      </div>

      <h2 style={{fontSize:17,margin:"26px 0 4px"}}>Self-test</h2>
      {!selfRes ? <p style={{color:"var(--silt)",fontSize:12.5}}>Running…</p>
        : selfRes.error ? <p style={{color:"var(--rfp)",fontSize:12.5}}>{selfRes.error}</p>
        : <>
            <p style={{color:"var(--silt)",margin:"0 0 14px",fontSize:12.5}}>
              <span className={selfRes.passed === selfRes.total ? "up" : "down"}
                style={{font:"600 12.5px monospace"}}>{selfRes.passed} / {selfRes.total} checks passed</span>
              {" "}— run just now, in this browser, against the tables actually loaded.
            </p>
            {selfRes.checks.map((c,i)=>(
              <div className="checkline" key={i}>
                <span className={"mk " + (c.pass ? "p" : "f")}>{c.pass ? "✓" : "✗"}</span>
                <span className="nm2">{c.name}</span>
                <span className="dt">{c.detail}</span>
              </div>
            ))}
          </>}
      <div className="note">
        <strong>What the self-test cannot check.</strong> It proves the tool is internally consistent: the
        protein never changes, stop codons survive, gamma behaves at the cardinal points, host-specific motif
        rules are applied to the right host, an organism with no table refuses instead of guessing, and the
        optimizer beats a random baseline. It proves nothing about whether a higher score means more protein.
        That claim needs measured expression data, and the Benchmark tab describes the experiment that would
        test it.
      </div>
    </>
  );
}

function RcMethPane() {
  return (
    <div className="prose">
      <h2>What step 00 computes</h2>
      <p>For a fixed protein, every synonymous coding sequence is a candidate. The optimizer searches that
        space for the sequence that maximizes a weighted sum of five terms, each scaled to 0–1:</p>
      <div className="formula">F(x) = w<sub>cai</sub>·f<sub>cai</sub> + w<sub>env</sub>·f<sub>env</sub> + w<sub>gc</sub>·f<sub>gc</sub> + w<sub>str</sub>·f<sub>str</sub> + w<sub>cons</sub>·f<sub>cons</sub></div>
      <ul>
        <li><code>f_cai</code> — codon adaptation index against the species table, the geometric mean of relative adaptiveness w = f(codon)/f(best synonym).</li>
        <li><code>f_env</code> — 60% adaptation against a growth-rate-blended tRNA pool, 40% fit of third-position GC to an environment-shifted target.</li>
        <li><code>f_gc</code> — global GC plus the worst 45 bp sliding window, both against the target.</li>
        <li><code>f_str</code> — one minus the folded fraction of the first 48 nt.</li>
        <li><code>f_cons</code> — a violation-density penalty on restriction sites, internal ribosome binding sites, long single-base runs and repeated 12-mers.</li>
      </ul>

      <h2>How conditions reach the sequence</h2>
      <p>The chain is deliberately explicit, because “37 °C means use codon X” is not a mechanism. Conditions
        set a predicted growth rate; growth rate and duplex physics then set what the objective rewards.</p>
      <div className="formula">temperature, pH, salinity, O₂ → γ terms → μ/μ<sub>max</sub> → tRNA pool skew and objective weights</div>
      <p>Each γ is a cardinal-parameter model of the kind used in predictive microbiology (Rosso and
        colleagues): a factor is 0 outside the organism's minimum and maximum, 1 at its optimum, and the four
        γ values multiply. Three coupling coefficients then link that state to codon choice, and all three are
        exposed as sliders so you can set them to zero and re-run:</p>
      <ul>
        <li><strong>Growth rate → tRNA pool.</strong> Codon bias in highly expressed genes tracks tRNA gene copy number, and that skew is strongest in fast growth. Near μ<sub>max</sub> the target table is the highly-expressed one; as growth slows it relaxes toward the genome average, so aggressive bias buys less.</li>
        <li><strong>Temperature → third-position GC.</strong> Codon–anticodon duplex stability is set mostly by the wobble position. The model shifts the preferred GC3 up with growth temperature. This is the least settled of the three: the analogous trend is well supported for structural RNA but contested for coding sequence, which is exactly why the coefficient is adjustable and signed.</li>
        <li><strong>Salinity → third-position GC and folding.</strong> Cations screen the phosphate backbone, so duplexes are more stable in high salt. The folding term carries a salt correction of the SantaLucia form, and the GC3 target shifts down to compensate.</li>
      </ul>

      <h2>Host class changes the rules</h2>
      <p>Most of the bundled hosts are bacteria and one is not, and that distinction is enforced rather than decorative:</p>
      <ul>
        <li><strong>Bacteria</strong> (<code>E. coli</code>, <code>B. subtilis</code>, <code>Halomonas</code>, <code>V. natriegens</code>) initiate translation at a Shine-Dalgarno sequence, so an AGGAGG-like motif inside the ORF can start translation in the wrong place and is removed.</li>
        <li><strong>Yeast</strong> has no Shine-Dalgarno sequence at all; initiation is cap-dependent scanning. Applying the bacterial rule would be meaningless. The equivalent internal hazard is premature cleavage and polyadenylation, so for <code>S. cerevisiae</code> the same constraint targets poly(A) signals instead.</li>
      </ul>
      <p>A yeast poly(A) signal is tripartite: an upstream <em>efficiency element</em>, a downstream
        <em> positioning element</em>, and the poly(A) site. The efficiency element is the TA-rich part usually
        called the TATATA family, and saturation mutagenesis narrowed it to the consensus <code>TAYRTA</code>
        (Y = C or T, R = A or G). That expands to exactly four hexamers, of which TATATA is the most efficient.</p>
      <p>Strand handling follows the same logic. Restriction sites are read on duplex DNA, so both the site and
        its reverse complement are removed. Initiation and poly(A) motifs act on the mRNA, so only the coding
        strand is checked — removing their reverse complements would delete codon choices for no reason.</p>

      <h2>Search</h2>
      <p>Three stages, and constraints outrank the score. A dynamic program over synonymous choices, with the
        previous codon as state, solves the separable part of the objective exactly, including motifs that
        straddle a codon boundary. Simulated annealing then works on the full objective, which is not
        separable because of the folding and sliding-window terms, and a coordinate-ascent pass guarantees the
        answer is at least a single-codon local optimum. The temperature schedule is deliberately cold —
        single-codon moves shift F by roughly 10⁻⁴ to 10⁻², and a hotter schedule random-walks away from the
        dynamic-programming solution. The stop codon is held fixed throughout.</p>
      <p>A third stage then walks any remaining constraint violations and takes the cheapest synonymous change
        that clears each one. This exists because a weighted sum handles constraints badly at the last mile:
        every decreasing penalty is convex, so removing the final violation is richly rewarded while going
        from two to one barely moves the score, and a single-codon hill climber stalls holding two restriction
        sites it would gladly have removed one at a time. Candidates are then compared lexicographically —
        fewer violations first, objective score only as a tiebreak. If you ticked a box saying remove these
        sites, that is a constraint on the answer rather than a preference to be traded away.</p>

      <h2>How this connects to the plasmid</h2>
      <p>The CDS you accept here fills the template's user-supplied CDS slot in step 01, and
        <code> designer.js</code> then treats it exactly like a catalog part: it is scanned for the assembly
        method's enzyme sites, included in the Gibson primer design, and drawn on the plasmid map. Because the
        assembly method is known before the search runs, the sites that method cannot tolerate are removed
        while the CDS still has synonymous freedom to spend — which is cheaper than discovering the conflict
        after the backbone is fixed. Evidence is inherited rather than upgraded: recoding a part whose
        sequence is a placeholder yields a placeholder, so it still blocks the build.</p>

      <h2>Folding proxy</h2>
      <p>The initiation-window term uses base-pair maximization with pair energies standing in for stacking,
        not a full nearest-neighbour model. It is a monotone proxy for local pairing potential, salt- and
        temperature-corrected, then mapped through a logistic with a softening constant. Treat the folded
        fraction as an ordering, not a physical probability. For publication-grade numbers, export the
        sequence and re-fold it in ViennaRNA or a comparable package.</p>

      <h2>What this does not tell you</h2>
      <p>The output is a score, not a prediction of protein yield. No term here has been fitted to measured
        expression, so a higher F means the sequence better satisfies the stated objective — nothing more.
        Expression also depends on the promoter, the ribosome binding site and its spacing, plasmid copy
        number, secretion signals, protein folding and toxicity, and none of that is modelled. The bundled
        codon tables are approximate, and the hosts differ enough in GC that using the wrong one produces a
        sequence that is worse than no optimization at all.</p>

      <h2>Turning this into a result</h2>
      <p>The interesting question is not whether the tool produces a sequence. It is whether the environment
        terms carry information. A clean design: fix a set of coding sequences with measured expression in
        your organism, score them under the growth-only model and under the full model, and compare how well
        each score correlates with the measurement on held-out data. Report the coefficients you fitted, the
        confidence interval, and the case where the environment terms made no difference — that last one is
        the honest control.</p>
    </div>
  );
}

/* ── Main App ────────────────────────────────────────────────────────── */
function App() {
  const [mode, setMode] = useState("template");   // "template" | "automatic"
  const [host, setHost] = useState("");
  const [parts, setParts] = useState([]);       // {id, name, type, seq, len}
  const [result, setResult] = useState(null);
  const [tab, setTab] = useState("map");
  const [addFilter, setAddFilter] = useState("");   // "" = all types
  const [copied, setCopied] = useState(false);
  const [expanded, setExpanded] = useState(null); // part id for seq editing
  const [db, setDb] = useState(null);            // parts array from ./data/parts.json
  const [dbErr, setDbErr] = useState(null);
  const [templates, setTemplates] = useState(null);
  const [tplId, setTplId] = useState("");
  const [cdsPart, setCdsPart] = useState(null);     // chosen gene of interest
  // Phase 5B item 13: fillTemplate()/design() already accept ANY part-shaped
  // userCds object as-is (see designer.js -- it never requires the object to
  // exist in partsById), so a part registered through the same session-local
  // customPartRegistry.js Automatic Design Mode uses can be dropped in here
  // unchanged. One registry instance, created lazily, shared by every
  // "gene of interest" registration this session.
  const customRegistryRef = useRef(null);
  if (!customRegistryRef.current && window.Automatic && window.Automatic.createCustomPartRegistry) {
    customRegistryRef.current = window.Automatic.createCustomPartRegistry();
  }
  const [asmErr, setAsmErr] = useState(null);   // names of parts with no sequence
  const [codonOrgs, setCodonOrgs] = useState(null); // from ./data/codon_tables.json
  const [cdsMode, setCdsMode] = useState("catalog"); // "catalog" | "optimize"
  const [optCds, setOptCds] = useState(null);        // CDS accepted from step 00
  const [rawCds, setRawCds] = useState("");          // CDS pasted in, used as-is
  const [rawErr, setRawErr] = useState(null);

  useEffect(() => {
    let cancelled = false;
    const get = u => fetch(u, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(u + " - HTTP " + r.status); return r.json(); });
    Promise.all([get("./data/parts.json"), get("./data/templates.json"), get("./data/codon_tables.json")])
      .then(([p, t, c]) => {
        if (cancelled) return;
        setDb(p.parts || []);
        setTemplates(t.templates || []);
        setTplId(prev => prev || (t.templates && t.templates[0] ? t.templates[0].id : ""));
        setCodonOrgs(window.Codon ? window.Codon.loadOrganisms(c) : null);
      })
      .catch(e => { if (!cancelled) setDbErr(e.message); });
    return () => { cancelled = true; };
  }, []);

  // name -> part. 293 names repeat in the SnapGene bundle; first occurrence wins.
  const byName = useMemo(() => {
    const m = new Map();
    if (db) for (const p of db) if (!m.has(p.name)) m.set(p.name, p);
    return m;
  }, [db]);
  const byId = useMemo(() => {
    const m = new Map();
    if (db) for (const p of db) m.set(p.id, p);
    return m;
  }, [db]);

  // the exact record a design part came from; falls back to name for custom
  // parts, and to the step-00 CDS, which exists only in memory
  const meta = p =>
    (p.srcId && byId.get(p.srcId))
    || (cdsMatch && (p.srcId === cdsMatch.id || p.name === cdsMatch.name) ? cdsMatch : null)
    || byName.get(p.name) || null;

  // design() indexes with partsById[id], so it needs a plain object, not the Map
  const partsById = useMemo(() => {
    const o = {};
    if (db) for (const p of db) o[p.id] = p;
    return o;
  }, [db]);

  const template = useMemo(
    () => (templates || []).find(t => t.id === tplId) || null,
    [templates, tplId]
  );

  const cdsPool = useMemo(() => (db || []).filter(p => p.type === "cds"), [db]);
  const addPool = useMemo(
    () => (!db ? [] : addFilter ? db.filter(p => p.type === addFilter) : db),
    [db, addFilter]
  );
  // Step 00 decides where the gene of interest comes from: a catalog part, or
  // a CDS the codon optimizer produced. Only one is ever handed to designer.js.
  const cdsMatch = cdsMode === "optimize" ? optCds : cdsPart;

  // { plan } on success, { err } on failure - no setState during render
  const designed = useMemo(() => {
    if (!template || !window.Designer) return {};
    try { return { plan: window.Designer.design(template, partsById, cdsMatch) }; }
    catch (e) { return { err: e.message }; }
  }, [template, partsById, cdsMatch]);
  const plan = designed.plan || null;
  const designErr = designed.err || null;

  useEffect(() => {
    if (!plan || !template) return;
    setHost(template.host);
    setParts(prev => {
      const seeded = plan.order.map(o => {
        // The step-00 CDS is not in the catalog, so partsById cannot resolve
        // it; without this fallback it would seed with seq === null and the
        // whole design would read as unbuildable.
        const rec = partsById[o.id]
          || (cdsMatch && cdsMatch.id === o.id ? cdsMatch : null);
        const seq = rec ? rec.seq : null;
        return {
          id: ++_uid, srcId: o.id, name: o.name,
          type: (rec && rec.type) || ROLE_TYPE[o.role] || o.role,
          role: o.role, seq, len: seq ? seq.length : 0,
        };
      });
      return [...seeded, ...prev.filter(p => p.extra)];   // hand-added parts survive
    });
    setResult(null); setExpanded(null); setAsmErr(null);
  }, [plan, template, partsById, cdsMatch]);

  /* A CDS pasted in step 00 and used exactly as given. Reading frame and
     internal stops are still checked - a frameshifted insert is a wasted
     synthesis order whether or not it was codon-optimized. */
  const useRawCds = () => {
    const C = window.Codon;
    const p = C ? C.parseInput(rawCds) : null;
    if (!p) { setRawErr("./codon.js did not load, so the sequence cannot be checked."); return; }
    if (p.error) { setRawErr(p.error); return; }
    if (p.type !== "dna") { setRawErr("That looks like protein. A CDS used as-is must be DNA — switch to “Codon-optimize first” to encode a protein."); return; }
    setRawErr(null);
    setCdsPart({
      id: "raw_pasted_cds", name: "Pasted CDS", type: "cds",
      seq: p.dna, length: p.dna.length, gc: +gcCalc(p.dna).toFixed(1),
      desc: `Coding sequence pasted into the builder and used as-is. ${p.aa.length} codons`
          + `${p.hasStop ? ", stop codon included" : ", no stop codon"}. Not recoded.`,
      src: "User-supplied sequence, pasted into the builder (not codon-optimized)",
      evidence: "verified", hosts: {},
    });
  };

  const addRecord = rec => {
    const seq = seqFor(rec, host);
    setParts(p => [...p, {id:++_uid, srcId:rec.id, name:rec.name, type:rec.type, seq, len: seq ? seq.length : 0, extra:true}]);
    setResult(null); setAsmErr(null);
  };

  // free text with no match: keep it as a custom part to paste a sequence into
  const addCustom = name => {
    setParts(p => [...p, {id:++_uid, srcId:null, name, type:guessType(name), seq:null, len:0, extra:true}]);
    setResult(null); setAsmErr(null);
  };

  const updateSeq = (id, newSeq) => {
    const s = newSeq.toUpperCase().replace(/[^ATCG]/g,"");
    setParts(p => p.map(x => x.id===id ? {...x, seq:s, len:s.length} : x));
    setResult(null); setAsmErr(null);
  };

  const delPart = id => { setParts(p => p.filter(x => x.id!==id)); setResult(null); setAsmErr(null); };
  const movePart = (id,d) => setParts(prev => {
    const i=prev.findIndex(x=>x.id===id);
    if(i+d<0||i+d>=prev.length) return prev;
    const a=[...prev]; [a[i],a[i+d]]=[a[i+d],a[i]]; setResult(null); setAsmErr(null); return a;
  });

  const assemble = () => {
    const blockers = [];
    if (plan) {
      for (const g of plan.gaps) {
        blockers.push(g.role + " — " + g.reason + (g.missing ? " (" + g.missing.join(", ") + ")" : ""));
      }
    }
    for (const p of parts) if (!p.seq) blockers.push(p.name + " — no verified sequence on file");
    if (blockers.length) {
      setAsmErr(blockers);
      setResult(null);
      return;
    }
    setAsmErr(null);
    const assembled = parts.map(p=>p.seq).join("");
    const gc = gcCalc(assembled);
    const proto = protocolFor(host);
    setResult({ assembled, gc, total: assembled.length, proto });
    setTab("map");
  };

  const copyFASTA = () => {
    if (!result) return;
    navigator.clipboard.writeText(`>plasmid|${host.replace(". ","_")}|Lysqdvp001|${result.total}bp|GC${result.gc.toFixed(1)}%\n${result.assembled}`);
    setCopied(true); setTimeout(()=>setCopied(false),2000);
  };

  // Phase 6, item 3: "Use This Design" -- convert an Automatic Design
  // candidate into the SAME parts/host/result shape this Template-Guided
  // workflow already produces from its own template+CDS pipeline, then open
  // the existing (unmodified) Map/Parts/Sequence/Delivery tabs on it. Reuses
  // window.Automatic.buildWorkspaceHandoff() for the actual conversion --
  // this function only assigns the resulting values into App()'s own state.
  // tplId is cleared to "" (template resolves to null) so the template-
  // driven re-seed effect above (keyed on plan/template) never fires and
  // silently overwrites the handed-off parts with a template's own defaults.
  const handoffToWorkspace = ({ candidate, anchorPart, host: h, assemblyMethod: am, partsById: pBid }) => {
    if (!window.Automatic) return;
    const handoff = window.Automatic.buildWorkspaceHandoff(candidate, { partsById: pBid || partsById, anchorPart, host: h, assemblyMethod: am });
    setTplId("");
    setCdsPart(null);
    setParts(handoff.parts.map(p => ({ id: ++_uid, srcId: p.srcId, name: p.name, type: p.type, role: p.role, seq: p.seq, len: p.len })));
    setHost(handoff.host || "");
    setResult({ assembled: handoff.assembledSequence, gc: handoff.gc, total: handoff.totalBp, proto: protocolFor(handoff.host) });
    setAsmErr(null);
    setExpanded(null);
    setTab("map");
    setMode("template");
  };

  /* Merge note: the steps are labelled Sequence / Design / Output, so the
     first gate is having a coding sequence, not a host (the host is set the
     moment a template loads, which would skip step 1 immediately). result is
     tested first because an Automatic Design handoff sets host and result
     without ever setting cdsMatch, and that is finished work, not step 1. */
  const stepN = result ? 3 : cdsMatch ? 2 : 1;
  const S = {
    card:{background:"#1e293b",border:"1px solid #334155",borderRadius:12,overflow:"hidden",marginBottom:16},
    label:{fontSize:11,color:"#475569",marginBottom:10,textTransform:"uppercase",letterSpacing:1.2,display:"block"},
    tabBtn:a=>({flex:1,padding:"10px 4px",background:"none",border:"none",borderBottom:`2px solid ${a?"#0ea5e9":"transparent"}`,color:a?"#38bdf8":"#475569",cursor:"pointer",fontSize:11,fontWeight:a?600:400}),
    ib:{background:"none",border:"none",color:"#475569",cursor:"pointer",padding:"2px 5px",fontSize:12},
  };

  if (dbErr || !db || !templates) return (
    <div style={{minHeight:"100vh",background:"#0f172a",color:"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:26,marginBottom:10}}>🧬</div>
        {dbErr
          ? <div style={{color:"#f87171"}}>Could not load ./data/parts.json — {dbErr}</div>
          : <div style={{color:"#64748b"}}>Loading parts…</div>}
      </div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"#0f172a",color:"#e2e8f0"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(90deg,#0c4a6e,#0369a1)",padding:"13px 20px",display:"flex",alignItems:"center",gap:12,borderBottom:"2px solid #0284c7"}}>
        <span style={{fontSize:22}}>🧬</span>
        <div>
          <div style={{fontWeight:800,fontSize:15}}>Del Norte iGEM · Plasmid Builder</div>
          <div style={{fontSize:11,color:"#7dd3fc"}}>Sequence assembly for coral reef protection · no login required</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:4,alignItems:"center"}}>
          {["Sequence","Design","Output"].map((l,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:3}}>
              <div style={{width:24,height:24,borderRadius:"50%",background:stepN>i+1?"#0ea5e9":stepN===i+1?"#1e40af":"#1e293b",border:`2px solid ${stepN>i+1?"#38bdf8":stepN===i+1?"#3b82f6":"#334155"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:stepN>i+1?"#fff":stepN===i+1?"#93c5fd":"#475569"}}>{i+1}</div>
              <span style={{fontSize:10,color:stepN===i+1?"#93c5fd":"#334155"}}>{l}</span>
              {i<2&&<span style={{color:"#1e3a5f",margin:"0 3px"}}>›</span>}
            </div>
          ))}
        </div>
      </div>

      {/* 00 - where the coding sequence comes from.
          Step 00 gets its own wider column: the optimizer's rail + results
          layout needs more than the 860px the rest of the builder uses, and
          the .rc media query collapses it to one column below 1100px. */}
      <div style={{padding:"20px 20px 0",maxWidth:cdsMode==="optimize"?1320:860,margin:"0 auto"}}>
        <div style={{marginBottom:16}}>
          <span style={S.label}>00 — Coding sequence</span>
          {/* overflow must stay visible or the rail and tab strip cannot stick */}
          <div style={{...S.card,overflow:"visible",marginBottom:0}}>
            <div style={{display:"flex",borderBottom:"1px solid #1e293b",flexWrap:"wrap"}}>
              {[["catalog","Use an existing sequence","A CDS from the catalog, or one you already have"],
                ["optimize","Codon-optimize first","Recode a protein or CDS for this host and its growth conditions"]]
                .map(([id,label,sub])=>{
                const on = cdsMode === id;
                return (
                  <button key={id} onClick={()=>setCdsMode(id)}
                    style={{flex:"1 1 220px",textAlign:"left",padding:"12px 14px",cursor:"pointer",
                      background:on?"#0c2a3f":"none",border:"none",
                      borderBottom:`2px solid ${on?"#0ea5e9":"transparent"}`}}>
                    <div style={{fontSize:12.5,fontWeight:on?700:500,color:on?"#38bdf8":"#94a3b8"}}>
                      {on ? "● " : "○ "}{label}
                    </div>
                    <div style={{fontSize:10.5,color:"#475569",marginTop:3,lineHeight:1.45}}>{sub}</div>
                  </button>
                );
              })}
            </div>

            <div style={cdsMode==="catalog"?{padding:"14px"}:undefined}>
              {cdsMode === "catalog" ? (
                <div>
                  <div style={{fontSize:10,color:"#475569",margin:"0 0 9px",letterSpacing:.6,textTransform:"uppercase"}}>
                    Gene of interest · {cdsPool.length.toLocaleString()} CDS in the catalog
                  </div>
                  {cdsPart ? (
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"9px 11px",background:"#0f172a",
                      border:"1px solid #1e3a5f",borderRadius:7,flexWrap:"wrap"}}>
                      <span style={{flex:1,minWidth:120,fontSize:12.5,color:"#93c5fd"}}>{cdsPart.name}</span>
                      <span style={{fontSize:10,color:"#475569",fontFamily:"monospace",whiteSpace:"nowrap"}}>
                        {cdsPart.seq ? cdsPart.length.toLocaleString()+" bp" : "no seq"}
                        {cdsPart.seq ? ` · GC ${gcCalc(cdsPart.seq).toFixed(1)}%` : ""}
                      </span>
                      <EvidencePill evidence={cdsPart.evidence}/>
                      <button onClick={()=>setCdsPart(null)} style={{...S.ib,fontSize:15}} title="Clear">×</button>
                    </div>
                  ) : (
                    <div style={{display:"flex"}}>
                      <PartCombo pool={cdsPool} placeholder="Search CDS by name, or paste a DNA sequence to find it…"
                        onPick={rec=>{setCdsPart(rec);}} hint="↵ registers as custom CDS"
                        onCustom={raw => {
                          // Phase 5B item 13, moved here from step 01 when the CDS
                          // picker did: a pasted sequence with no catalog match
                          // (PartCombo's exact/substring/revcomp search already found
                          // nothing, or this isn't a name at all) is registered as a
                          // genuine session-local custom CDS -- never written to
                          // data/parts.json -- instead of being discarded, the same way
                          // Automatic Design Mode's "Register Custom Part" flow does.
                          const seq = asDNA(raw);
                          if (!seq || !customRegistryRef.current) return;
                          const res = customRegistryRef.current.registerCustomPart({
                            name: `Custom CDS (${seq.length} bp)`, seq, role: "cds" });
                          if (res.ok) setCdsPart(res.part);
                        }}/>
                    </div>
                  )}
                  {cdsPart && cdsPart.desc && (
                    <div style={{fontSize:11,color:"#64748b",marginTop:7,lineHeight:1.55}}>{cdsPart.desc}</div>
                  )}
                  {cdsPart && cdsPart.src && (
                    <div style={{fontSize:10,color:"#475569",marginTop:4}}>📚 {cdsPart.src}</div>
                  )}

                  <div style={{fontSize:10,color:"#475569",margin:"16px 0 7px",letterSpacing:.6,textTransform:"uppercase"}}>
                    Or paste a CDS you already have
                  </div>
                  <textarea value={rawCds} onChange={e=>{setRawCds(e.target.value); setRawErr(null);}}
                    rows={3} spellCheck={false}
                    placeholder="Paste a ready coding sequence (ATCG). It is used exactly as pasted — nothing is recoded."
                    style={{width:"100%",background:"#0f172a",border:"1px solid #334155",borderRadius:6,
                      color:"#60a5fa",fontSize:10,fontFamily:"monospace",padding:"8px",resize:"vertical",outline:"none"}}/>
                  <div style={{display:"flex",gap:8,marginTop:8,alignItems:"center",flexWrap:"wrap"}}>
                    <button onClick={useRawCds} disabled={!rawCds.trim()}
                      style={{background:rawCds.trim()?"#0369a1":"#1e293b",border:"none",borderRadius:6,
                        color:rawCds.trim()?"#fff":"#475569",fontSize:11,padding:"7px 12px",
                        cursor:rawCds.trim()?"pointer":"not-allowed"}}>
                      Use as gene of interest
                    </button>
                    {rawErr && <span style={{fontSize:11,color:"#fbbf24"}}>{rawErr}</span>}
                  </div>
                  <div style={{fontSize:10,color:"#475569",marginTop:8,lineHeight:1.5}}>
                    Checked for reading frame and internal stops only. Switch to “Codon-optimize first”
                    if you want it recoded for the host.
                  </div>
                </div>
              ) : (
                <CodonPanel
                  organisms={codonOrgs}
                  cdsPool={cdsPool}
                  template={template}
                  accepted={optCds}
                  onAccept={part=>{setOptCds(part); setResult(null); setAsmErr(null);}}
                  onClear={()=>{setOptCds(null); setResult(null); setAsmErr(null);}}/>
              )}
            </div>
          </div>
        </div>
      </div>

      {/* steps 01 and 03 keep the builder's original 860px column, untouched */}
      <div style={{padding:"0 20px 20px",maxWidth:860,margin:"0 auto"}}>

        {/* Template-Guided Mode (existing workflow, unchanged) vs. Automatic Design Mode (new).
            Phase 6, item 1: make the product distinction explicit, in plain language --
            never "AI"/exaggerated framing, just what each mode actually does. */}
        <div style={{display:"flex",gap:8,marginBottom:6,background:"#1e293b",border:"1px solid #334155",borderRadius:10,padding:4}}>
          {[["template","🧭 Template-Guided"],["automatic","🧮 Automatic Design"]].map(([id,label])=>(
            <button key={id} onClick={()=>setMode(id)}
              style={{flex:1,padding:"9px 10px",borderRadius:7,border:"none",cursor:"pointer",fontSize:12,fontWeight:mode===id?700:500,
                background:mode===id?"linear-gradient(90deg,#0369a1,#0ea5e9)":"transparent",color:mode===id?"#fff":"#94a3b8"}}>
              {label}
            </button>
          ))}
        </div>
        <div style={{fontSize:11,color:"#64748b",lineHeight:1.5,marginBottom:16,padding:"0 4px"}}>
          {mode==="template"
            ? <span><b style={{color:"#93c5fd"}}>Build from a known architecture.</b> You choose the template and components; this mode helps you assemble, inspect, and export the plasmid.</span>
            : <span><b style={{color:"#93c5fd"}}>Design around a biological part.</b> You supply a part, host, and design objective (plus any components that must stay fixed); a constraint-based computational design engine determines the architecture, supporting parts, and valid alternatives.</span>}
        </div>

        {mode==="automatic" && (
          window.AutomaticModeUI
            ? <window.AutomaticModeUI db={db} templates={templates} partsById={partsById} onUseDesign={handoffToWorkspace} />
            : <div style={{color:"#fca5a5",fontSize:12,padding:12}}>./automatic/AutomaticModeUI.jsx did not load — the page must be served over http, not opened as a file.</div>
        )}

        {mode==="template" && <React.Fragment>

        {/* 01 - template, gene, and the editable part list */}
        <div style={{marginBottom:16}}>
          <span style={S.label}>01 — Design</span>
          <div style={S.card}>

            {/* template + gene of interest */}
            <div style={{display:"flex",gap:10,padding:"12px 14px",flexWrap:"wrap",borderBottom:"1px solid #1e293b"}}>
              <div style={{flex:"1 1 240px",minWidth:0}}>
                <div style={{fontSize:10,color:"#475569",marginBottom:5}}>HOST / TEMPLATE</div>
                <select value={tplId} onChange={e=>setTplId(e.target.value)}
                  style={{width:"100%",background:"#0f172a",border:"1px solid #334155",borderRadius:6,color:"#e2e8f0",fontSize:12,padding:"8px",outline:"none"}}>
                  {templates.map(t => <option key={t.id} value={t.id}>{t.host} — {t.label}</option>)}
                </select>
              </div>
              <div style={{flex:"1 1 240px",minWidth:0}}>
                <div style={{fontSize:10,color:"#475569",marginBottom:5}}>
                  GENE OF INTEREST · from step 00
                </div>
                {cdsMatch ? (
                  <div style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"#0f172a",
                    border:`1px solid ${cdsMode==="optimize"?"#166534":"#1e3a5f"}`,borderRadius:6}}>
                    <span style={{flex:1,minWidth:0,fontSize:12,color:cdsMode==="optimize"?"#4ade80":"#93c5fd",
                      overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cdsMatch.name}</span>
                    <span style={{fontSize:10,color:"#475569",whiteSpace:"nowrap"}}>
                      {cdsMatch.seq ? cdsMatch.length.toLocaleString()+" bp" : "no seq"}
                    </span>
                    {cdsMode === "optimize" && (
                      <span style={{fontSize:9,padding:"2px 6px",background:"#22c55e1a",color:"#22c55e",
                        borderRadius:20,border:"1px solid #22c55e33",whiteSpace:"nowrap"}}>optimized</span>
                    )}
                    <EvidencePill evidence={cdsMatch.evidence}/>
                  </div>
                ) : (
                  // The CDS picker that used to live here moved to step 00,
                  // which is now the single place a coding sequence enters the
                  // build (catalog, pasted, or codon-optimized). The custom-part
                  // registration this slot carried moved there with it.
                  <div style={{padding:"8px 10px",background:"#0f172a",border:"1px dashed #334155",
                    borderRadius:6,fontSize:11,color:"#475569"}}>
                    None yet — choose or optimize one in step 00. The template's own default CDS is used meanwhile.
                  </div>
                )}
              </div>
            </div>

            {designErr && (
              <div style={{margin:"12px 14px",background:"#2a0a0a",border:"1px solid #b91c1c",borderRadius:8,padding:"10px 12px",color:"#fca5a5",fontSize:12}}>
                designer.js threw: {designErr}
              </div>
            )}
            {!window.Designer && (
              <div style={{margin:"12px 14px",background:"#2a0a0a",border:"1px solid #b91c1c",borderRadius:8,padding:"10px 12px",color:"#fca5a5",fontSize:12}}>
                ./designer.js did not load — the page must be served over http, not opened as a file.
              </div>
            )}

            {plan && (
              <div style={{display:"flex",background:"#0f172a",borderBottom:"1px solid #1e293b"}}>
                {[{v:plan.buildable?"Buildable":"Not buildable",l:"Status",c:plan.buildable?"#4ade80":"#f87171"},
                  {v:`${(plan.totalLength/1000).toFixed(2)} kb`,l:"Length",c:"#38bdf8"},
                  {v:`${plan.gc}%`,l:"GC",c:"#38bdf8"},
                  {v:parts.length,l:"Parts",c:"#38bdf8"}].map((s,i)=>(
                  <div key={i} style={{flex:1,padding:"10px 6px",textAlign:"center",borderRight:i<3?"1px solid #1e293b":"none"}}>
                    <div style={{fontSize:14,fontWeight:800,color:s.c}}>{s.v}</div>
                    <div style={{fontSize:10,color:"#475569"}}>{s.l}</div>
                  </div>
                ))}
              </div>
            )}

            {/* type legend */}
            <div style={{padding:"8px 14px",background:"#0f172a",borderBottom:"1px solid #1e293b",display:"flex",gap:10,flexWrap:"wrap"}}>
              {TYPES.map(t=><div key={t} style={{display:"flex",alignItems:"center",gap:5,fontSize:11}}><div style={{width:8,height:8,borderRadius:2,background:FILL[t]}}/><span style={{color:"#64748b"}}>{t}</span></div>)}
            </div>

            {/* the design, editable in place */}
            <div style={{padding:"12px 14px"}}>
              <div style={{fontSize:10,color:"#475569",marginBottom:8,letterSpacing:.5}}>
                PART ORDER · 5' → 3' · use ▲▼ to reorder, ✎ to edit a sequence
              </div>
              {parts.length === 0 && (
                <div style={{fontSize:12,color:"#475569",padding:"10px 0"}}>No parts yet — pick a template above.</div>
              )}
                {parts.map((p,i)=>(
                  <div key={p.id} style={{marginBottom:5}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"#0f172a",border:`1px solid ${FILL[p.type]||"#334155"}22`,borderLeft:`3px solid ${FILL[p.type]||"#334155"}`,borderRadius:expanded===p.id?"7px 7px 0 0":7}}>
                      <span style={{color:"#334155",fontSize:11,minWidth:16}}>{i+1}</span>
                      <span style={{flex:1,fontSize:13}}>{p.name}{!p.seq && <span style={{color:"#fbbf24",marginLeft:6,fontSize:11}} title="No verified sequence on file">⚠️</span>}</span>
                      <span style={{fontSize:10,color:"#64748b"}}>{p.len.toLocaleString()} bp</span>
                      <span style={{fontSize:10,padding:"2px 7px",background:`${FILL[p.type]||"#64748b"}1a`,color:FILL[p.type]||"#64748b",borderRadius:20,border:`1px solid ${FILL[p.type]||"#64748b"}33`}}>{p.type}</span>
                      <EvidencePill evidence={meta(p)?.evidence}/>
                      <button onClick={()=>setExpanded(expanded===p.id?null:p.id)} style={{...S.ib,color:expanded===p.id?"#38bdf8":"#475569",fontSize:11}} title="Edit sequence">✎</button>
                      <button onClick={()=>movePart(p.id,-1)} style={S.ib}>▲</button>
                      <button onClick={()=>movePart(p.id,1)} style={S.ib}>▼</button>
                      <button onClick={()=>delPart(p.id)} style={{...S.ib,fontSize:16}}>×</button>
                    </div>
                    {expanded===p.id && (
                      <div style={{background:"#070f1a",border:`1px solid ${FILL[p.type]||"#334155"}44`,borderTop:"none",borderRadius:"0 0 7px 7px",padding:10}}>
                        <div style={{fontSize:10,color:"#475569",marginBottom:6}}>{meta(p)?.src || "Custom sequence"}</div>
                        <textarea
                          value={p.seq || ""}
                          onChange={e=>updateSeq(p.id,e.target.value)}
                          rows={4}
                          placeholder="Paste or edit sequence here (ATCG only)"
                          style={{width:"100%",background:"#0f172a",border:"1px solid #334155",borderRadius:5,color:"#60a5fa",fontSize:10,fontFamily:"monospace",padding:"8px",resize:"vertical",outline:"none"}}
                        />
                        {meta(p)?.evidence === "placeholder" && (
                          <div style={{fontSize:10,color:"#fbbf24",marginTop:4}}>⚠️ No verified sequence on file — paste your lab sequence above before ordering synthesis.</div>
                        )}
                      </div>
                    )}
                  </div>
                ))}


              {/* add more parts, optionally filtered by type */}
              <div style={{display:"flex",gap:8,marginTop:10,alignItems:"stretch",flexWrap:"wrap"}}>
                <select value={addFilter} onChange={e=>setAddFilter(e.target.value)}
                  style={{background:"#0f172a",border:"1px solid #334155",borderRadius:6,color:addFilter?FILL[addFilter]:"#94a3b8",fontSize:11,padding:"0 8px",outline:"none",flexShrink:0}}>
                  <option value="">all types</option>
                  {TYPES.map(t=><option key={t} value={t}>{t}</option>)}
                </select>
                <PartCombo
                  pool={addPool}
                  placeholder={addFilter ? `Add another ${addFilter} — name or DNA… (${addPool.length.toLocaleString()} parts)` : `Add another part — name or DNA… (${addPool.length.toLocaleString()} parts)`}
                  onPick={addRecord}
                  onCustom={addCustom}
                  hint="↵ adds as custom"
                />
              </div>
            </div>

            {plan && (
              <div style={{padding:"0 14px"}}>
                {plan.gaps.length > 0 && (
                  <Section title={`Gaps (${plan.gaps.length})`} tone="#f87171">
                    {plan.gaps.map((g,i)=>(
                      <div key={i} style={{fontSize:12,color:"#fca5a5",padding:"5px 8px",background:"#2a0a0a",border:"1px solid #7f1d1d",borderRadius:5,marginBottom:4}}>
                        <b>{g.role}</b> — {g.reason}
                        {g.missing && <span style={{color:"#7f1d1d",display:"block",fontSize:10,marginTop:2,fontFamily:"monospace"}}>wanted: {g.missing.join(", ")}</span>}
                      </div>
                    ))}
                  </Section>
                )}

                {plan.placeholders.length > 0 && (
                  <Section title={`Placeholders (${plan.placeholders.length})`} tone="#fbbf24">
                    <div style={{fontSize:12,color:"#fbbf24",padding:"5px 8px",background:"#1c1500",border:"1px solid #78350f",borderRadius:5}}>
                      {plan.placeholders.join(", ")}
                      <span style={{display:"block",fontSize:10,color:"#a16207",marginTop:3}}>No verified sequence on file — primers cannot be designed until these are supplied.</span>
                    </div>
                  </Section>
                )}

                {plan.siteConflicts.length > 0 && (
                  <Section title={`Site conflicts (${plan.siteConflicts.length})`} tone="#fbbf24">
                    {plan.siteConflicts.map((c,i)=>(
                      <div key={i} style={{fontSize:12,color:"#fbbf24",padding:"4px 8px",background:"#1c1500",border:"1px solid #78350f",borderRadius:5,marginBottom:4}}>
                        <b>{c.enzyme}</b> site inside <b>{c.part}</b> at position {c.position.toLocaleString()}
                      </div>
                    ))}
                  </Section>
                )}

                {plan.primers.length > 0 && (
                  <Section title={`Gibson primers (${plan.primers.length*2})`}>
                    {plan.primers.map((pr,i)=>(
                      <div key={i} style={{marginBottom:8,background:"#070f1a",border:"1px solid #1e293b",borderRadius:6,padding:"8px 10px"}}>
                        <div style={{fontSize:11,color:"#93c5fd",marginBottom:4}}>{pr.part} <span style={{color:"#475569"}}>· {pr.role}</span></div>
                        {[["F",pr.fwd,pr.fwd_tm],["R",pr.rev,pr.rev_tm]].map(([d,s,t])=>(
                          <div key={d} style={{display:"flex",gap:8,alignItems:"baseline",marginTop:2}}>
                            <span style={{fontSize:10,color:"#475569",minWidth:12}}>{d}</span>
                            <span style={{flex:1,fontFamily:"monospace",fontSize:10,color:"#60a5fa",wordBreak:"break-all"}}>{s}</span>
                            <span style={{fontSize:10,color:"#64748b",whiteSpace:"nowrap"}}>Tm {t}°C</span>
                          </div>
                        ))}
                      </div>
                    ))}
                  </Section>
                )}
              </div>
            )}

            {/* assemble */}
            <div style={{padding:"0 14px 14px"}}>
              {asmErr && (
                <div style={{background:"#2a0a0a",border:"1px solid #b91c1c",borderRadius:9,padding:"12px 14px",marginBottom:10}}>
                  <div style={{color:"#f87171",fontSize:13,fontWeight:700,marginBottom:6}}>
                    ✕ Cannot assemble — {asmErr.length} unresolved issue{asmErr.length>1?"s":""}
                  </div>
                  <ul style={{margin:"0 0 8px 18px",padding:0}}>
                    {asmErr.map(msg => <li key={msg} style={{color:"#fca5a5",fontSize:12,lineHeight:1.6}}>{msg}</li>)}
                  </ul>
                  <div style={{color:"#fbbf24",fontSize:11}}>
                    Supply the missing parts in ./data/parts.json, or click ✎ above to paste a verified sequence.
                  </div>
                </div>
              )}
              <button onClick={assemble} disabled={!parts.length} style={{width:"100%",padding:"13px",background:"linear-gradient(90deg,#0369a1,#0ea5e9)",border:"none",borderRadius:9,color:"#fff",fontSize:14,fontWeight:700,cursor:!parts.length?"not-allowed":"pointer",opacity:!parts.length?.5:1}}>
                ⚗️ Assemble Plasmid
              </button>
            </div>
          </div>
        </div>

        {/* Step 3 */}
        {result && (
          <div>
            <span style={S.label}>03 — Assembly output</span>
            <div style={S.card}>
              <div style={{display:"flex",background:"#0f172a",borderBottom:"1px solid #1e293b"}}>
                {[{v:`${(result.total/1000).toFixed(2)} kb`,l:"Plasmid size"},{v:`${result.gc.toFixed(1)}%`,l:"GC content"},{v:parts.length,l:"Parts"},{v:host.split(" ")[1]||host,l:"Host"}].map((s,i)=>(
                  <div key={i} style={{flex:1,padding:"12px 6px",textAlign:"center",borderRight:i<3?"1px solid #1e293b":"none"}}>
                    <div style={{fontSize:16,fontWeight:800,color:"#38bdf8"}}>{s.v}</div>
                    <div style={{fontSize:10,color:"#475569"}}>{s.l}</div>
                  </div>
                ))}
              </div>
              <div style={{display:"flex",background:"#0f172a",borderBottom:"1px solid #1e293b"}}>
                {[["map","🗺 Map"],["parts","🧩 Parts"],["sequence","🔤 Sequence"],["delivery","📋 Delivery"]].map(([id,label])=>(
                  <button key={id} onClick={()=>setTab(id)} style={S.tabBtn(tab===id)}>{label}</button>
                ))}
              </div>

              <div style={{padding:"18px 16px"}}>

                {tab==="map" && (
                  <div style={{display:"flex",gap:20,alignItems:"flex-start",flexWrap:"wrap"}}>
                    <PlasmidSVG parts={parts.map(p=>({...p,len:p.len}))} total={result.total} host={host} gc={result.gc}/>
                    <div style={{flex:1,minWidth:160}}>
                      <div style={{fontSize:11,color:"#64748b",marginBottom:10}}>SUMMARY</div>
                      {[
                        `${(result.total/1000).toFixed(2)} kb assembled from ${parts.length} parts`,
                        `GC content: ${result.gc.toFixed(1)}%`,
                        `Host: ${host}${template ? " — " + template.label : ""}`,
                        `Assembly: ${template ? template.assembly : "manual"}`,
                        cdsMatch
                          ? `Gene of interest: ${cdsMatch.name}${cdsMatch.desc ? " — " + cdsMatch.desc : ""}`
                          : `Gene of interest: none selected`,
                        `Selection: ${result.proto ? result.proto.selection : "no protocol on file for " + host}`,
                      ].map((f,i)=>(
                        <div key={i} style={{display:"flex",gap:8,marginBottom:8}}>
                          <span style={{color:"#0ea5e9",flexShrink:0}}>◆</span>
                          <span style={{fontSize:12,color:"#cbd5e1",lineHeight:1.5}}>{f}</span>
                        </div>
                      ))}
                      <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid #1e293b"}}>
                        <div style={{fontSize:10,color:"#475569",marginBottom:6}}>LEGEND</div>
                        {TYPES.filter(t=>parts.some(p=>p.type===t)).map(t=>(
                          <div key={t} style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                            <div style={{width:10,height:10,borderRadius:2,background:FILL[t]}}/>
                            <span style={{fontSize:11,color:"#64748b"}}>{t}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {tab==="parts" && (
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {parts.map((p,i)=>(
                      <div key={i} style={{border:`1px solid ${FILL[p.type]||"#334155"}33`,borderLeft:`3px solid ${FILL[p.type]||"#334155"}`,background:`${FILL[p.type]||"#64748b"}0a`,borderRadius:8,padding:"12px 14px"}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                          <span style={{fontWeight:600,color:FILL[p.type]||"#94a3b8",fontSize:13}}>{p.name}</span>
                          <span style={{fontSize:11,color:"#475569"}}>{p.len.toLocaleString()} bp</span>
                        </div>
                        <div style={{fontSize:12,color:"#94a3b8",marginBottom:3}}>{meta(p)?.desc||"Custom part"}</div>
                        <div style={{fontSize:11,color:"#475569"}}>📚 {meta(p)?.src||"User-provided"}</div>
                        <div style={{marginTop:8,fontFamily:"monospace",fontSize:10,color:"#334155",background:"#070f1a",borderRadius:4,padding:"6px 8px",wordBreak:"break-all"}}>
                          {p.seq ? p.seq.slice(0,100)+"…" : "no sequence on file"}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {tab==="sequence" && (()=>{
                  const seq=result.assembled;
                  const cmap=buildCmap(seq,parts);
                  const W=60; const lines=[];
                  for(let i=0;i<seq.length;i+=W) lines.push({n:i+1,s:seq.slice(i,i+W)});
                  return (
                    <div>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                        <span style={{fontSize:12,color:"#64748b"}}>{seq.length.toLocaleString()} nt · color-coded by part</span>
                        <button onClick={copyFASTA} style={{background:"#0369a1",border:"none",borderRadius:6,color:"#fff",fontSize:12,padding:"6px 14px",cursor:"pointer"}}>{copied?"✓ Copied!":"Copy FASTA"}</button>
                      </div>
                      <div style={{fontSize:11,color:"#fbbf24",marginBottom:8,padding:"6px 10px",background:"#1c1500",borderRadius:6,border:"1px solid #78350f"}}>
                        ⚠️ Parts marked ⚠️ have no verified sequence in ./data/parts.json and contribute 0 bp — click ✎ on each to paste your verified sequence before ordering synthesis.
                      </div>
                      <div style={{maxHeight:320,overflowY:"auto",background:"#070f1a",borderRadius:8,padding:"10px 12px",fontFamily:"monospace"}}>
                        {lines.map(({n,s})=>(
                          <div key={n} style={{display:"flex",gap:8,marginBottom:1}}>
                            <span style={{color:"#1e3a5f",fontSize:10,minWidth:46,textAlign:"right",flexShrink:0}}>{n}</span>
                            <span style={{fontSize:10,lineHeight:1.7}}>
                              {cRuns(s,n-1,cmap).map((r,i)=><span key={i} style={{color:r.col}}>{r.s}</span>)}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}

                {tab==="delivery" && !result.proto && (
                  <div style={{background:"#1c1500",border:"1px solid #78350f",borderRadius:10,padding:"14px 16px",color:"#fbbf24",fontSize:13}}>
                    No transformation protocol on file for <i>{host}</i>.
                    <div style={{fontSize:11,color:"#a16207",marginTop:5}}>
                      Protocols are defined per host in PROTOCOLS; add one for this template's host to populate this tab.
                    </div>
                  </div>
                )}

                {tab==="delivery" && result.proto && (
                  <div>
                    <div style={{background:"#0c4a6e",border:"1px solid #0369a1",borderRadius:10,padding:"12px 16px",marginBottom:16}}>
                      <div style={{fontWeight:700,color:"#38bdf8",fontSize:14}}>{result.proto.method}</div>
                      <div style={{fontSize:12,color:"#7dd3fc",fontStyle:"italic",marginTop:2}}>{host}</div>
                    </div>
                    <div style={{fontSize:10,color:"#475569",marginBottom:10,letterSpacing:.5}}>PROTOCOL</div>
                    {result.proto.steps.map((s,i)=>(
                      <div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
                        <div style={{minWidth:24,height:24,borderRadius:"50%",background:"#1e3a5f",border:"2px solid #0369a1",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#38bdf8",flexShrink:0}}>{i+1}</div>
                        <span style={{fontSize:13,color:"#cbd5e1",paddingTop:2,lineHeight:1.5}}>{s}</span>
                      </div>
                    ))}
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:4}}>
                      <div style={{background:"#0f172a",border:"1px solid #166534",borderRadius:8,padding:12}}>
                        <div style={{fontSize:10,color:"#4ade80",marginBottom:4}}>SELECTION</div>
                        <div style={{fontSize:12,color:"#cbd5e1"}}>{result.proto.selection}</div>
                      </div>
                      <div style={{background:"#0f172a",border:"1px solid #1e3a5f",borderRadius:8,padding:12}}>
                        <div style={{fontSize:10,color:"#60a5fa",marginBottom:4}}>VERIFICATION</div>
                        <div style={{fontSize:12,color:"#cbd5e1"}}>{result.proto.verification}</div>
                      </div>
                    </div>
                  </div>
                )}
              </div>

              <div style={{padding:"0 16px 14px"}}>
                <button onClick={()=>{setResult(null);setAsmErr(null);setTab("map");}} style={{width:"100%",padding:"8px",background:"none",border:"1px solid #334155",borderRadius:7,color:"#475569",cursor:"pointer",fontSize:12,marginTop:4}}>
                  ↩ New design
                </button>
              </div>
            </div>
          </div>
        )}

        </React.Fragment>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
