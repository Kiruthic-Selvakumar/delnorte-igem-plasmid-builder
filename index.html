<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Del Norte iGEM — Plasmid Builder</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;font-family:system-ui,-apple-system,sans-serif}
input,select,button,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}

/* ════════════════════════════════════════════════════════════════════════
   Step 00 — the codon optimizer.

   This is the Reef Codon interface, reproduced layout for layout: the
   organism bar, the physiology chain, the sticky control rail, the tab
   strip and every pane. Only the tokens below changed. Reef Codon's own
   palette (deep water + coral fluorescent-protein emission) and its
   Bricolage/IBM Plex typefaces are replaced by this project's slate theme
   and system fonts, so step 00 reads as part of the builder rather than a
   second product bolted on.

   Every rule is scoped under .rc. The builder's own styles are inline and
   must stay untouched, so nothing here may select a bare element.
   ══════════════════════════════════════════════════════════════════════ */
.rc{
  /* surfaces, darkest to lightest — the builder's four-step slate ramp */
  --abyss:#0f172a; --water:#1e293b; --shelf:#293549; --reef:#334155;
  --inset:#070f1a;
  /* text ramp */
  --foam:#e2e8f0; --silt:#94a3b8; --dim:#475569;
  /* accents: the builder's, in the roles Reef Codon gave its own */
  --cfp:#38bdf8; --gfp:#4ade80; --rfp:#f87171; --chromo:#c084fc; --amber:#fbbf24;
  --r:3px;
  --mono:monospace;
  --sans:system-ui,-apple-system,sans-serif;
  --disp:var(--sans);

  background:var(--abyss); color:var(--foam);
  font:400 14px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  /* matches the step-00 card's radius: the card must keep overflow visible
     so the rail and tab strip can stick, so .rc rounds its own corners */
  border-radius:0 0 11px 11px;
}
.rc h1,.rc h2,.rc h3{font-family:var(--disp);font-weight:800;letter-spacing:-.02em;margin:0}
.rc a{color:var(--cfp)}
.rc ::selection{background:var(--cfp);color:var(--abyss)}
.rc :focus-visible{outline:2px solid var(--cfp);outline-offset:2px}

.rc .eyebrow{
  font:600 10px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase;
  color:var(--dim);
}

/* ── top bar ─────────────────────────────────────────────────────────── */
.rc .topbar{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  padding:12px 22px; border-bottom:1px solid var(--reef);
  background:#0f172ae6;
}
.rc .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.rc .brand h1{font-size:19px;line-height:1}
.rc .brand p{margin:3px 0 0;font:400 11px/1 var(--mono);color:var(--dim);letter-spacing:.02em}
.rc .polyp{width:26px;height:26px;flex:none}

/* ── organism bar ─────────────────────────────────────────────────────── */
.rc .orgbar{
  display:flex;gap:0;border-bottom:1px solid var(--reef);overflow-x:auto;
  background:linear-gradient(180deg,#0f172a00,#1e293b66);
}
.rc .orgbar button{
  appearance:none;background:transparent;border:0;border-right:1px solid var(--reef);
  padding:11px 18px;cursor:pointer;text-align:left;white-space:nowrap;color:var(--silt);
  display:flex;flex-direction:column;gap:4px;min-width:150px;
  border-bottom:2px solid transparent;
}
.rc .orgbar button:hover{background:var(--water)}
.rc .orgbar button[aria-selected="true"]{background:var(--shelf);color:var(--foam)}
.rc .orgbar .nm{font:600 12.5px/1 var(--sans);letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.rc .orgbar .nm i{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor;opacity:.45}
.rc .orgbar button[aria-selected="true"] .nm i{opacity:1}
.rc .orgbar .sub{font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

.rc .badge{
  display:inline-flex;align-items:center;gap:4px;border-radius:2px;padding:2px 5px;
  font:600 8.5px/1.35 var(--mono);letter-spacing:.09em;text-transform:uppercase;
}
.rc .badge.ok{background:#14532d55;color:var(--gfp)}
.rc .badge.prov{background:#78350f55;color:var(--amber)}
.rc .badge.euk{background:#4c1d9555;color:var(--chromo)}
.rc .badge.none{background:#7f1d1d55;color:var(--rfp)}

.rc .banner{
  display:flex;gap:11px;align-items:flex-start;border:1px solid var(--reef);border-left:2px solid var(--amber);
  border-radius:var(--r);padding:12px 14px;margin-bottom:18px;background:var(--water);
  font-size:12.5px;line-height:1.6;color:var(--silt);
}
.rc .banner.euk{border-left-color:var(--chromo)}
.rc .banner.ok{border-left-color:var(--gfp)}
.rc .banner strong{color:var(--foam);display:block;margin-bottom:3px}

.rc .checkline{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--shelf);font:400 11.5px/1.4 var(--mono)}
.rc .checkline .mk{width:15px;flex:none;text-align:center;font-weight:600}
.rc .checkline .mk.p{color:var(--gfp)} .rc .checkline .mk.f{color:var(--rfp)}
.rc .checkline .nm2{flex:1;color:var(--silt)}
.rc .checkline .dt{color:var(--dim);text-align:right}

.rc .cardgrid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px 8px;align-items:center;margin-top:10px}
.rc .cardgrid label{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.rc .cardgrid input{padding:6px 7px;font-size:11px;text-align:right}
.rc .cardgrid .hd{font:500 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}

.rc .run{
  appearance:none;border:1px solid var(--cfp);border-radius:var(--r);cursor:pointer;
  background:var(--cfp);color:#06263a;
  font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:11px 18px; transition:filter .15s, opacity .15s;
}
.rc .run:hover{filter:brightness(1.12)}
.rc .run[disabled]{opacity:.45;cursor:progress}

/* ── signature: physiology chain ─────────────────────────────────────── */
.rc .chain{border-bottom:1px solid var(--reef);background:linear-gradient(180deg,#0f172a00,#1e293b88)}
.rc .chain-head{display:flex;align-items:baseline;gap:12px;padding:14px 22px 0;flex-wrap:wrap}
.rc .chain-head p{margin:0;color:var(--silt);font-size:12px}
.rc .chain-inner{
  display:grid;
  grid-template-columns:minmax(150px,1fr) 18px minmax(180px,1.2fr) 18px auto 18px minmax(190px,1.3fr);
  align-items:center; gap:0 10px; padding:12px 22px 20px;
}
.rc .chain-arrow{color:var(--reef);text-align:center;font-size:15px;user-select:none}
.rc .chain-col{display:flex;flex-direction:column;gap:7px}
.rc .chain-lab{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}

.rc .factor{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:9px;font:500 11px/1 var(--mono)}
.rc .factor .nm{color:var(--silt)}
.rc .factor .val{color:var(--foam);text-align:right;font-variant-numeric:tabular-nums}
.rc .meter{height:4px;background:var(--shelf);border-radius:2px;overflow:hidden}
.rc .meter i{display:block;height:100%;background:var(--cfp);transition:width .35s cubic-bezier(.2,.8,.3,1)}
.rc .meter.g i{background:var(--gfp)} .rc .meter.a i{background:var(--amber)} .rc .meter.r i{background:var(--rfp)}

.rc .mu{display:flex;flex-direction:column;align-items:center;gap:4px}
.rc .mu svg{display:block}
.rc .mu .cap{font:500 9px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}

.rc .wstack{display:flex;height:26px;border-radius:var(--r);overflow:hidden;border:1px solid var(--reef)}
.rc .wstack i{display:block;height:100%;transition:width .35s cubic-bezier(.2,.8,.3,1);position:relative}
.rc .wkey{display:flex;flex-wrap:wrap;gap:4px 12px;font:500 10px/1 var(--mono);color:var(--silt)}
.rc .wkey span{display:flex;align-items:center;gap:5px}
.rc .wkey b{width:7px;height:7px;border-radius:1px;display:inline-block}
.rc .w-cai{background:var(--cfp)} .rc .w-env{background:var(--chromo)} .rc .w-gc{background:var(--gfp)}
.rc .w-struct{background:var(--rfp)} .rc .w-cons{background:var(--amber)}

/* ── layout ──────────────────────────────────────────────────────────── */
.rc .layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:0;align-items:start}
.rc .rail{
  border-right:1px solid var(--reef); padding:0 0 24px;
  position:sticky; top:0; max-height:100vh; overflow-y:auto;
}
.rc .results{padding:0 0 24px;min-width:0}

.rc .block{border-bottom:1px solid var(--reef);padding:18px 20px}
.rc .block h3{font-size:12px;font-family:var(--mono);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--silt);margin-bottom:12px}
.rc .hint{color:var(--dim);font-size:11.5px;line-height:1.5;margin:8px 0 0}

.rc textarea,.rc input[type=text],.rc input[type=number],.rc select{
  width:100%;background:var(--abyss);border:1px solid var(--reef);border-radius:var(--r);
  color:var(--foam);font:400 12px/1.5 var(--mono);padding:9px 10px;
}
.rc textarea{resize:vertical;min-height:104px;letter-spacing:.03em;word-break:break-all}
.rc select{cursor:pointer}
.rc .row{display:flex;gap:8px;align-items:center}
.rc .row+.row{margin-top:8px}
.rc .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rc .chip{
  appearance:none;border:1px solid var(--reef);background:transparent;color:var(--silt);
  border-radius:var(--r);font:500 10.5px/1 var(--mono);padding:6px 9px;cursor:pointer;
}
.rc .chip:hover{border-color:var(--cfp);color:var(--foam)}
.rc .chip[disabled]{opacity:.45;cursor:not-allowed}

.rc .status{margin-top:9px;font:500 11px/1.45 var(--mono);color:var(--silt);display:flex;gap:7px;flex-wrap:wrap}
.rc .status.bad{color:var(--amber)}
.rc .status.ok{color:var(--gfp)}

.rc .slider{margin-bottom:15px}
.rc .slider .top{display:flex;justify-content:space-between;align-items:baseline;font:500 11px/1 var(--mono);margin-bottom:7px}
.rc .slider .top .k{color:var(--silt)}
.rc .slider .top .v{color:var(--foam);font-variant-numeric:tabular-nums}
.rc input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;background:transparent;height:16px;margin:0;cursor:pointer;
}
.rc input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--shelf);border-radius:2px}
.rc input[type=range]::-moz-range-track{height:3px;background:var(--shelf);border-radius:2px}
.rc input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--foam);
  margin-top:-5px;border:0;
}
.rc input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--foam);border:0}
.rc input[type=range]:disabled{opacity:.4;cursor:not-allowed}

.rc .check{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--foam);margin-bottom:9px;cursor:pointer}
.rc .check input{margin:2px 0 0;accent-color:var(--cfp);flex:none}
.rc .check span small{display:block;color:var(--dim);font-size:11px;line-height:1.4}

/* ── tabs ────────────────────────────────────────────────────────────── */
.rc .tabs{display:flex;gap:0;border-bottom:1px solid var(--reef);overflow-x:auto;
  position:sticky;top:0;background:#0f172af0;backdrop-filter:blur(10px);z-index:20}
.rc .tabs button{
  appearance:none;background:transparent;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font:500 11.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  padding:14px 16px;cursor:pointer;white-space:nowrap;
}
.rc .tabs button:hover{color:var(--silt)}
.rc .tabs button[aria-selected="true"]{color:var(--foam);border-bottom-color:var(--cfp)}
.rc .pane{padding:22px}

.rc .empty{
  border:1px dashed var(--reef);border-radius:var(--r);padding:40px 26px;text-align:center;color:var(--silt);
}
.rc .empty strong{display:block;font-family:var(--disp);font-size:17px;color:var(--foam);margin-bottom:6px;letter-spacing:-.01em}

/* ── metric strip ────────────────────────────────────────────────────── */
.rc .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--reef);border:1px solid var(--reef);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.rc .metric{background:var(--water);padding:12px 13px}
.rc .metric .k{font:500 9.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.rc .metric .v{font:700 21px/1.1 var(--disp);margin-top:7px;font-variant-numeric:tabular-nums}
.rc .metric .d{font:500 10.5px/1 var(--mono);margin-top:5px;color:var(--silt)}
.rc .up{color:var(--gfp)} .rc .down{color:var(--rfp)} .rc .flat{color:var(--dim)}

/* ── codon track ─────────────────────────────────────────────────────── */
.rc .tracklegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 14px;font:500 10.5px/1 var(--mono);color:var(--silt)}
.rc .tracklegend span{display:flex;align-items:center;gap:6px}
.rc .tracklegend b{width:8px;height:8px;border-radius:1px;display:inline-block}
.rc .track{display:flex;flex-wrap:wrap;gap:2px}
.rc .cod{
  position:relative;width:38px;padding:4px 0 5px;border-radius:2px;text-align:center;
  background:var(--water);border-top:2px solid transparent;cursor:default;
}
.rc .cod .aa{display:block;font:500 8.5px/1 var(--mono);color:var(--dim)}
.rc .cod .nt{display:block;font:500 11px/1.2 var(--mono);color:var(--silt);letter-spacing:.02em;margin-top:2px}
.rc .cod.ch{background:var(--shelf)}
.rc .cod.ch .nt{color:var(--foam)}
.rc .cod .was{display:block;font:400 8.5px/1 var(--mono);color:var(--dim);text-decoration:line-through;min-height:9px}
.rc .cod.lock{outline:1px solid var(--reef);outline-offset:-1px}
.rc .cod[data-d="cai"]{border-top-color:var(--cfp)}
.rc .cod[data-d="env"]{border-top-color:var(--chromo)}
.rc .cod[data-d="gc"]{border-top-color:var(--gfp)}
.rc .cod[data-d="struct"]{border-top-color:var(--rfp)}
.rc .cod[data-d="cons"]{border-top-color:var(--amber)}
#tip{
  position:fixed;z-index:60;display:none;pointer-events:none;width:212px;text-align:left;
  background:#070f1a;border:1px solid #334155;border-radius:3px;padding:9px 11px;
  font:400 11px/1.55 monospace;color:#94a3b8;box-shadow:0 10px 28px #000a;
}
#tip b{color:#e2e8f0;font-weight:600}
#tip em{font-style:normal;color:#38bdf8}
@media (prefers-reduced-motion:no-preference){
  .rc .track .cod.ch{animation:rcpop .3s cubic-bezier(.2,.8,.3,1) both}
}
@keyframes rcpop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

.rc .seqbox{margin-top:20px}
.rc .seqbox .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.rc .seqout{
  background:var(--inset);border:1px solid var(--reef);border-radius:var(--r);padding:12px;
  font:400 12px/1.75 var(--mono);word-break:break-all;letter-spacing:.04em;color:var(--silt);max-height:230px;overflow:auto;
}
.rc .seqout .init{color:var(--rfp)}

/* ── objective bars ──────────────────────────────────────────────────── */
.rc .obj{display:grid;grid-template-columns:132px 1fr 128px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--shelf)}
.rc .obj .name{font:500 11.5px/1.3 var(--mono);color:var(--foam)}
.rc .obj .name small{display:block;color:var(--dim);font-size:10px;letter-spacing:.04em}
.rc .obj .lanes{display:flex;flex-direction:column;gap:4px}
.rc .lane{display:flex;align-items:center;gap:8px;font:500 10px/1 var(--mono);color:var(--dim)}
.rc .lane .t{width:44px;flex:none}
.rc .lane .bar{flex:1;height:7px;background:var(--shelf);border-radius:2px;overflow:hidden}
.rc .lane .bar i{display:block;height:100%;background:var(--dim);transition:width .4s}
.rc .lane.new .bar i{background:var(--cfp)}
.rc .obj .num{font:500 11px/1.4 var(--mono);text-align:right;font-variant-numeric:tabular-nums}

.rc table.data{width:100%;border-collapse:collapse;font:400 12px/1.5 var(--mono)}
.rc table.data th{
  text-align:left;font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--reef);white-space:nowrap;
}
.rc table.data td{padding:9px 10px;border-bottom:1px solid var(--shelf);color:var(--silt);font-variant-numeric:tabular-nums}
.rc table.data td.lead{color:var(--foam)}
.rc table.data tr.best td{color:var(--foam)}
.rc table.data tr.best td.lead{color:var(--cfp)}

.rc .note{border-left:2px solid var(--reef);padding:2px 0 2px 14px;color:var(--silt);font-size:12.5px;line-height:1.65;margin:18px 0}
.rc .note strong{color:var(--foam)}

.rc .prose{max-width:74ch}
.rc .prose h2{font-size:17px;margin:26px 0 9px}
.rc .prose h2:first-child{margin-top:0}
.rc .prose p{color:var(--silt);line-height:1.7;margin:0 0 12px}
.rc .prose ul{color:var(--silt);line-height:1.7;padding-left:19px;margin:0 0 12px}
.rc .prose code{font-family:var(--mono);font-size:12px;color:var(--foam);background:var(--shelf);padding:1px 5px;border-radius:2px}
.rc .formula{
  font-family:var(--mono);font-size:12.5px;color:var(--foam);background:var(--water);
  border:1px solid var(--reef);border-radius:var(--r);padding:13px 15px;margin:0 0 14px;overflow-x:auto;line-height:1.8;
}

.rc .progress{height:2px;background:var(--shelf);border-radius:2px;overflow:hidden;margin-top:10px}
.rc .progress i{display:block;height:100%;width:0;background:var(--cfp);transition:width .18s linear}

.rc .paretowrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px}
.rc .axisrow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.rc .axisrow label{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.rc .axisrow select{width:auto;min-width:150px}
.rc .ptinfo{border:1px solid var(--reef);border-radius:var(--r);padding:14px;background:var(--water);font:400 11.5px/1.7 var(--mono);color:var(--silt)}
.rc .ptinfo h4{margin:0 0 9px;font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.rc .ptinfo dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}
.rc .ptinfo dt{color:var(--dim)} .rc .ptinfo dd{margin:0;color:var(--foam);text-align:right;font-variant-numeric:tabular-nums}
.rc circle.pt{cursor:pointer;transition:r .12s}
.rc circle.pt:hover{r:7}

.rc .cutable{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--reef);border:1px solid var(--reef);border-radius:var(--r);overflow:hidden}
.rc .aabox{background:var(--water);padding:11px 12px}
.rc .aabox .h{display:flex;justify-content:space-between;font:600 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--foam);margin-bottom:9px}
.rc .aabox .h em{font-style:normal;color:var(--dim);font-weight:400}
.rc .curow{display:grid;grid-template-columns:38px 1fr 34px;gap:7px;align-items:center;font:400 10.5px/1 var(--mono);color:var(--silt);margin-bottom:4px}
.rc .curow .cbar{height:5px;background:var(--shelf);border-radius:1px;overflow:hidden}
.rc .curow .cbar i{display:block;height:100%;background:var(--dim)}
.rc .curow.top{color:var(--foam)} .rc .curow.top .cbar i{background:var(--cfp)}
.rc .curow .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}

/* the handoff into step 01 — the one element Reef Codon has no analogue for */
.rc .handoff{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--reef);border-left:2px solid var(--gfp);border-radius:var(--r);
  background:var(--water);padding:13px 15px;margin-top:20px;
}
.rc .handoff .txt{flex:1;min-width:180px;font-size:12.5px;line-height:1.6;color:var(--silt)}
.rc .handoff .txt strong{color:var(--foam);display:block;margin-bottom:2px}
.rc .take{
  appearance:none;border:1px solid var(--gfp);border-radius:var(--r);cursor:pointer;

<script type="text/babel">
const { useState, useEffect, useLayoutEffect, useMemo, useRef } = React;

/* ── Delivery protocols (hardcoded per host) ───────────────────────────── */
const PROTOCOLS = {

    steps: [
      "Grow B. subtilis overnight in LB; dilute 1:100 into competence medium (SpC) and grow to OD600 = 0.5–0.8.",

    ],

  },
  "V. natrigens": {
    method: "Electroporation",
    steps: [
      "Grow V. natrigens in LB + 2% NaCl to OD600 = 0.4–0.6 at 30°C; chill on ice 20 min.",
      "Wash cells 3× with ice-cold VN electroporation buffer (272 mM sucrose, 7 mM K-phosphate pH 7.4, 1 mM MgCl₂).",
      "Resuspend pellet in 200 µL electroporation buffer (~10¹⁰ cells/mL); mix with 100–500 ng plasmid.",
      "Transfer to 1 mm electroporation cuvette; pulse at 1.8 kV, 25 µF, 200 Ω (time constant ~5 ms).",
      "Immediately add 800 µL LB + 2% NaCl; recover 1 h at 30°C with gentle shaking.",
      "Plate on LB + 2% NaCl + kanamycin (50 µg/mL); colonies appear in 6–8 h at 30°C."
    ],
    selection: "Kanamycin · 50 µg/mL",
    verification: "Colony PCR: Lys-F/Lys-R primers (~900 bp band); verify by Sanger sequencing"
  }
};

/* ── Part presets ─────────────────────────────────────────────────────── */
const HOST_ALIAS = { "V. natriegens": "V. natrigens" };
const protocolFor = host => PROTOCOLS[HOST_ALIAS[host] || host] || null;

/* ── Codon optimizer presentation ─────────────────────────────────────
   Labels and colours for the five objective terms in codon.js. The keys
   match Codon.TERM_KEYS; the engine itself carries no presentation. */
const TERM_META = {
  cai:    { label:"tRNA adaptation", sub:"CAI vs highly expressed",  cls:"w-cai",    color:"#38bdf8" },
  env:    { label:"Environment fit", sub:"pool blend + GC3",         cls:"w-env",    color:"#c084fc" },
  gc:     { label:"GC composition",  sub:"global + 45 bp window",    cls:"w-gc",     color:"#4ade80" },
  struct: { label:"Open initiation", sub:"first 48 nt folding",      cls:"w-struct", color:"#f87171" },
  cons:   { label:"Constraints",     sub:"sites, runs, repeats",     cls:"w-cons",   color:"#fbbf24" },
};
/* Growth-condition presets. "Lab optimum" resolves against the chosen
   organism's own cardinal values, so it means something different per host. */
const ENV_PRESETS = {
  lab:  { label:"Lab optimum", from:org => ({temp:org.cardinal.T.opt, ph:org.cardinal.pH.opt, salt:org.cardinal.salt.opt, oxygen:"aerobic"}) },
  reef: { label:"Reef seawater", from:() => ({temp:27, ph:8.1, salt:3.5, oxygen:"aerobic"}) },
  pond: { label:"Hypersaline pond", from:() => ({temp:33, ph:8.6, salt:15, oxygen:"microaerobic"}) },
};
const TABLE_TONE = { verified:"#22c55e", provisional:"#f97316", none:"#f87171" };

const FILL = {
  promoter:"#4ade80", operator:"#22d3ee", rbs:"#fbbf24", cds:"#60a5fa", signal:"#f472b6",
  terminator:"#f87171", marker:"#c084fc", origin:"#fb923c", orit:"#a3e635", other:"#64748b",
};
const EV = { verified:"#22c55e", placeholder:"#f97316" };
function EvidencePill({ evidence }) {
  const c = EV[evidence];
  if (!c) return null;
  return (
    <span
      title={evidence === "verified"
        ? "Sequence has a real source in ./data/parts.json"
        : "No verified sequence on file - needs a lab-confirmed sequence"}
      style={{fontSize:10,padding:"2px 7px",background:`${c}1a`,color:c,borderRadius:20,border:`1px solid ${c}33`,whiteSpace:"nowrap"}}
    >{evidence}</span>
  );
}
// roughly transcriptional order, then vector elements
const TYPES = ["promoter","operator","rbs","cds","signal","terminator","marker","origin","orit","other"];
const TYPE_MAP = {
  "Promoter":"promoter","RBS":"rbs","Endolysin":"cds","Terminator":"terminator",
  "Resistance":"marker","ori":"origin","origin":"origin","promoter":"promoter",
  "rbs":"rbs","cds":"cds","terminator":"terminator","marker":"marker",
};
function guessType(name) {
  const n = name.toLowerCase();
  if (n.includes("promoter")) return "promoter";
  if (n.includes("rbs") || n.includes("ribosome")) return "rbs";
  if (n.includes("endolysin") || n.includes("lysin") || n.includes("cds") || n.includes("gfp") || n.includes("mcherry")) return "cds";
  if (n.includes("terminator")) return "terminator";
  if (n.includes("resistance") || n.includes("kanr") || n.includes("ampr") || n.includes("spcr") || n.includes("cmr")) return "marker";
  if (n.includes("ori") || n.includes("origin")) return "origin";
  return "cds";
}
function gcCalc(seq) {
  if (!seq) return 0;
  const gc = [...seq].filter(c => c === "G" || c === "C").length;
  return (gc / seq.length) * 100;
}
function seqFor(entry, host) {
  if (!entry) return null;
  const variant = entry.hosts && entry.hosts[host];
  if (variant && "seq" in variant) return variant.seq;
  return entry.seq;
}
// template slot roles -> the existing type palette
const ROLE_TYPE = { ori:"origin", ori_shuttle:"origin", orit:"orit" };

function Section({ title, tone, children }) {
  return (
    <div style={{marginBottom:14}}>
      <div style={{fontSize:10,color:tone||"#475569",marginBottom:6,letterSpacing:.5,textTransform:"uppercase"}}>{title}</div>
      {children}
    </div>
  );
}

/* ── Searchable part dropdown ─────────────────────────────────────────
   Ranks name-prefix > name-substring > whole-word description match.
   Menu is position:fixed so an overflow:hidden ancestor cannot clip it. */
/* DNA query helpers. A query counts as DNA only when it is nothing but bases
   (whitespace and digits tolerated, so a wrapped or numbered paste works) and
   is >= 8 bases once cleaned. That floor keeps short words off the DNA path. */
const DNA_COMP = { A:"T", C:"G", G:"C", T:"A", N:"N" };
const revcomp = s => { let o = ""; for (let i = s.length - 1; i >= 0; i--) o += DNA_COMP[s[i]] || "N"; return o; };
const asDNA = raw => {
  if (!/^[acgtn0-9\s]+$/i.test(raw)) return "";
  const s = raw.toUpperCase().replace(/[^ACGTN]/g, "");
  return s.length >= 8 ? s : "";
};

function PartCombo({ pool, placeholder, onPick, onCustom, hint }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const boxRef = useRef(null);

  const res = useMemo(() => {
    const raw = q.trim();
    const s = raw.toLowerCase();
    if (!s || !pool || !pool.length) return { list: [], notes: null, dna: "" };
    const word = new RegExp("\\b" + s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
    const best = new Map();                       // id -> [rank, part, note]
    const add = (p, rank, note) => {
      const cur = best.get(p.id);
      if (!cur) { best.set(p.id, [rank, p, note || ""]); return; }
      if (rank < cur[0]) cur[0] = rank;
      if (note && !cur[2]) cur[2] = note;
    };
    for (const p of pool) {
      const i = p.name.toLowerCase().indexOf(s);
      if (i === 0) add(p, 1);
      else if (i > 0) add(p, 3);
      else if (word.test(p.desc || "")) add(p, 4);
    }
    const dna = asDNA(raw);
    if (dna) {
      const rc = revcomp(dna);
      for (const p of pool) {
        if (!p.seq) continue;
        const S = p.seq.toUpperCase();
        if (S === dna) { add(p, 0, "exact sequence match"); continue; }
        const f = S.indexOf(dna);
        if (f >= 0) { add(p, 2, "+ strand @ " + (f + 1).toLocaleString()); continue; }
        const r = S.indexOf(rc);
        if (r >= 0) add(p, 2, "- strand (revcomp) @ " + (r + 1).toLocaleString());
      }
    }
    const out = [...best.values()];
    out.sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length || a[1].name.localeCompare(b[1].name));
    const top = out.slice(0, 10);
    return { list: top.map(x => x[1]), notes: new Map(top.map(x => [x[1].id, x[2]])), dna };
  }, [q, pool]);
  const hits = res.list;

  useLayoutEffect(() => {
    if (!open || !hits.length) { setPos(null); return; }
    const place = () => {
      const el = boxRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      const gap = 4, edge = 12;
      const below = window.innerHeight - r.bottom - edge;
      const above = r.top - edge;
      const up = below < 180 && above > below;
      setPos({
        left: r.left, width: r.width, up,
        offset: up ? window.innerHeight - r.top + gap : r.bottom + gap,
        maxHeight: Math.max(120, Math.min(400, (up ? above : below) - gap)),
      });
    };
    place();
    window.addEventListener("scroll", place, true);
    window.addEventListener("resize", place);
    return () => {
      window.removeEventListener("scroll", place, true);
      window.removeEventListener("resize", place);
    };
  }, [open, hits.length, q]);

  const choose = rec => { onPick(rec); setQ(""); setSel(0); setOpen(false); };
  const key = e => {
    if (e.key === "ArrowDown") { e.preventDefault(); setSel(s => Math.min(s + 1, hits.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel(s => Math.max(s - 1, 0)); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (hits[sel]) choose(hits[sel]);
      else if (onCustom && q.trim()) { onCustom(q.trim()); setQ(""); setOpen(false); }
    } else if (e.key === "Escape") setOpen(false);
  };

  return (
    <div style={{flex:1,minWidth:0}}>
      <div ref={boxRef} style={{display:"flex",gap:8,padding:"7px 10px",background:"#0f172a",border:"1px solid #334155",borderRadius:6}}>
        <input
          value={q}
          onChange={e=>{setQ(e.target.value);setSel(0);setOpen(true);}}
          onFocus={()=>setOpen(true)}
          onBlur={()=>setOpen(false)}
          onKeyDown={key}
          placeholder={placeholder}
          style={{flex:1,minWidth:0,background:"none",border:"none",outline:"none",color:"#e2e8f0",fontSize:12}}
        />
        {q.trim() && (
          <span style={{fontSize:10,color:"#475569",alignSelf:"center",whiteSpace:"nowrap"}}>
            {hits.length
              ? `${hits.length===10?"top 10":hits.length}${res.dna?` · ${res.dna.length} bp`:""} · ↵`
              : (res.dna ? "no part contains that sequence" : (hint || "no match"))}
          </span>
        )}
      </div>
      {open && hits.length > 0 && pos && (
        <div style={{position:"fixed",left:pos.left,width:pos.width,[pos.up?"bottom":"top"]:pos.offset,
          maxHeight:pos.maxHeight,overflowY:"auto",background:"#0f172a",border:"1px solid #334155",
          borderRadius:7,zIndex:1000,boxShadow:"0 10px 30px rgba(0,0,0,.55)"}}>
          {hits.map((s,i)=>(
            <div key={s.id}
              onMouseDown={e=>{e.preventDefault();choose(s);}}
              onMouseEnter={()=>setSel(i)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",cursor:"pointer",
                background:i===sel?"#1e293b":"transparent",
                borderLeft:`3px solid ${i===sel?(FILL[s.type]||"#64748b"):"transparent"}`}}>
              <span style={{flex:1,minWidth:0}}>
                <span style={{display:"block",fontSize:12,color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</span>
                {res.notes && res.notes.get(s.id)
                  ? <span style={{display:"block",fontSize:10,color:"#22d3ee",fontFamily:"monospace",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{res.notes.get(s.id)}</span>
                  : s.desc && <span style={{display:"block",fontSize:10,color:"#475569",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.desc}</span>}
              </span>
              <span style={{fontSize:10,color:"#475569",whiteSpace:"nowrap"}}>{s.length ? s.length.toLocaleString()+" bp" : "\u2014"}</span>
              <span style={{fontSize:10,padding:"2px 7px",background:`${FILL[s.type]||"#64748b"}1a`,color:FILL[s.type]||"#64748b",borderRadius:20,border:`1px solid ${FILL[s.type]||"#64748b"}33`,whiteSpace:"nowrap"}}>{s.type}</span>
              <EvidencePill evidence={s.evidence}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

let _uid = 0;

/* ── SVG plasmid map ─────────────────────────────────────────────────── */
function PlasmidSVG({ parts, total, host, gc }) {
  if (!parts?.length || !total) return null;
  const W=320,cx=160,cy=160,R=115,r=73;
  const pt = (radius, deg) => {
    const rad = (deg-90)*Math.PI/180;
    return [cx+radius*Math.cos(rad), cy+radius*Math.sin(rad)];
  };
  let a=0;
  const segs = parts.map(p => { const sw=(p.len/total)*360; const o={...p,s:a,e:a+sw,sw}; a+=sw; return o; });
  return (
    <svg viewBox={`0 0 ${W} ${W}`} style={{width:260,flexShrink:0}}>
      {segs.map((sg,i) => {
        const [x1,y1]=pt(R,sg.s),[x2,y2]=pt(R,sg.e);
        const [xi1,yi1]=pt(r,sg.s),[xi2,yi2]=pt(r,sg.e);
        const lg=sg.sw>180?1:0;
        const d=`M${x1} ${y1} A${R} ${R} 0 ${lg} 1 ${x2} ${y2} L${xi2} ${yi2} A${r} ${r} 0 ${lg} 0 ${xi1} ${yi1}Z`;
        const [lx,ly]=pt(R+22,sg.s+sg.sw/2);
        return (
          <g key={i}>
            <path d={d} fill={FILL[sg.type]||"#64748b"} stroke="#0f172a" strokeWidth="1.5" opacity="0.92"/>
            {sg.sw>13 && <text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="7.5" fill="#e2e8f0" fontFamily="system-ui">{sg.name.length>13?sg.name.slice(0,11)+"…":sg.name}</text>}
          </g>
        );
      })}
      <circle cx={cx} cy={cy} r={r-1} fill="#0f172a"/>
      <text x={cx} y={cy-12} textAnchor="middle" fontSize="15" fontWeight="700" fill="#f1f5f9" fontFamily="system-ui">{(total/1000).toFixed(2)} kb</text>
      <text x={cx} y={cy+6}  textAnchor="middle" fontSize="9"  fill="#64748b" fontStyle="italic" fontFamily="system-ui">{host}</text>
      <text x={cx} y={cy+20} textAnchor="middle" fontSize="8"  fill="#475569" fontFamily="system-ui">GC: {gc.toFixed(1)}%</text>
    </svg>
  );
}

function buildCmap(seq, parts) {
  const m = new Array(seq.length).fill("#475569");
  let pos=0;
  parts.forEach(p => { for(let i=pos;i<Math.min(pos+p.len,seq.length);i++) m[i]=FILL[p.type]||"#64748b"; pos+=p.len; });
  return m;
}
function cRuns(str, start, m) {
  const r=[]; let col=null,s="";
  [...str].forEach((c,j)=>{ const nc=m[start+j]||"#475569"; if(nc!==col){if(s)r.push({s,col});col=nc;s=c;}else s+=c; });
  if(s)r.push({s,col}); return r;
}

/* ── Step 00: codon optimization ──────────────────────────────────────
   The Reef Codon interface, reproduced layout for layout: organism bar,
   physiology chain, sticky control rail, tab strip, and all seven panes.
   Only the look changed - the .rc block in <style> restyles it to this
   project's slate theme and system fonts.

   The optimization engine is ./codon.js. Nothing below does any science.

   Reef Codon shipped a demoSequence() that invented DNA with a PRNG. It is
   deliberately not ported, because CLAUDE.md forbids generating fake
   sequence, so "load an example" pulls a real CDS out of parts.json. */

function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type:"text/plain"}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
const pctS = x => (x * 100).toFixed(1) + "%";
const f3 = x => x.toFixed(3);

/* One tooltip node for the whole track, positioned and clamped on hover.
   Delegated on the container, so a 2,000-codon track costs two listeners
   rather than four thousand. */
function useTrackTips(ref) {
  useEffect(() => {
    const host = ref.current, tip = document.getElementById("tip");
    if (!host || !tip) return;
    const over = e => {
      const t = e.target.closest(".cod");
      if (!t || !t.dataset.tip) return;
      tip.innerHTML = t.dataset.tip;
      tip.style.display = "block";
      const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
      let x = Math.max(8, Math.min(r.left + r.width/2 - w/2, window.innerWidth - w - 8));
      let y = r.top - h - 8;
      if (y < 8) y = r.bottom + 8;
      tip.style.left = x + "px"; tip.style.top = y + "px";
    };
    const out = () => { tip.style.display = "none"; };
    host.addEventListener("mouseover", over);
    host.addEventListener("mouseleave", out);
    return () => {
      host.removeEventListener("mouseover", over);
      host.removeEventListener("mouseleave", out);
      tip.style.display = "none";
    };
  });
}
